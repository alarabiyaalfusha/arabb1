<script>
const D={"topics": {"1": {"ar": "التعبير عن الرأي", "id": "Menyatakan Pendapat", "items": [{"n": "1501", "v": [{"l": "", "ar": "فِي رَأْيِي، التَّعَلُّمُ مِنَ الْأَخْطَاءِ أَهَمُّ مِنْ تَجَنُّبِهَا.", "tr": "Fī raʾyī, at-taʿallumu mina al-akhṭāʾi ahammu min tajannubihā."}], "id": "Menurut saya, belajar dari kesalahan lebih penting daripada menghindarinya.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1502", "v": [{"l": "", "ar": "أَعْتَقِدُ أَنَّ السَّفَرَ يُوَسِّعُ الْآفَاقَ.", "tr": "Aʿtaqidu anna as-safara yuwassiʿu al-āfāqa."}], "id": "Saya yakin bepergian memperluas wawasan.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1503", "v": [{"l": "", "ar": "لَا أَرَى مُبَرِّرًا لِلتَّأْخِيرِ فِي مِثْلِ هَذِهِ الْمَوَاعِيدِ.", "tr": "Lā arā mubarriran lil-taʾkhīri fī mithli hādhihi al-mawāʿīdi."}], "id": "Saya tidak melihat alasan untuk terlambat pada janji seperti ini.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1504", "v": [{"l": "", "ar": "مِنْ وِجْهَةِ نَظَرِي، الْحَلُّ الْأَوَّلُ أَكْثَرُ وَاقِعِيَّةً.", "tr": "Min wijhati naẓarī, al-ḥallu al-awwalu aktharu wāqiʿiyyatan."}], "id": "Dari sudut pandang saya, solusi pertama lebih realistis.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1505", "v": [{"l": "", "ar": "يُمْكِنُنِي أَنْ أَتَفَهَّمَ رَأْيَكَ، لَكِنَّنِي لَا أُوَافِقُكَ.", "tr": "Yumkinunī an atafahhama raʾyaka, lakinnanī lā uwāfiquka."}], "id": "Saya bisa memahami pendapatmu, tapi saya tidak setuju.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1506", "v": [{"l": "", "ar": "أَرَى أَنَّ الْمُشْكِلَةَ لَيْسَتْ فِي الْمَالِ بَلْ فِي التَّنْظِيمِ.", "tr": "Arā anna al-mushkilata laysat fī al-māli bal fī at-tanẓīmi."}], "id": "Saya pikir masalahnya bukan di uang melainkan di pengaturan.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1507", "v": [{"l": "", "ar": "مِنَ الْوَاضِحِ أَنَّ الْوَقْتَ لَا يَكْفِي.", "tr": "Mina al-wāḍiḥi anna al-waqta lā yakfī."}], "id": "Jelas bahwa waktunya tidak cukup.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1508", "v": [{"l": "", "ar": "أَنَا مَعَ هَذِهِ الْفِكْرَةِ بِشَرْطٍ وَاحِدٍ.", "tr": "Anā maʿa hādhihi al-fikrati bi-sharṭin wāḥidin."}], "id": "Saya mendukung ide ini dengan satu syarat.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1509", "v": [{"l": "", "ar": "لَيْسَ مِنَ الْعَدْلِ أَنْ نَحْكُمَ عَلَيْهِ قَبْلَ أَنْ نَسْمَعَهُ.", "tr": "Laysa mina al-ʿadli an naḥkuma ʿalayhi qabla an nasmaʿahu."}], "id": "Tidak adil menghakiminya sebelum kita mendengarnya.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1510", "v": [{"l": "", "ar": "هَذِهِ النُّقْطَةُ تَحْتَاجُ إِلَى مَزِيدٍ مِنَ النِّقَاشِ.", "tr": "Hādhihi an-nuqṭatu taḥtāju ilā mazīdin mina an-niqāshi."}], "id": "Poin ini perlu dibahas lebih lanjut.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1511", "v": [{"l": "", "ar": "أُفَضِّلُ أَنْ أَتَّخِذَ قَرَارِي بَعْدَ التَّفْكِيرِ الْجَيِّدِ.", "tr": "Ufaḍḍilu an attakhidha qarārī baʿda at-tafkīri al-jayyidi."}], "id": "Saya lebih suka mengambil keputusan setelah berpikir baik-baik.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1512", "v": [{"l": "Laki-laki", "ar": "مَا رَأْيُكَ لَوْ أَجَّلْنَا الرِّحْلَةَ أُسْبُوعًا؟", "tr": "Mā raʾyuka law ajjalnā ar-riḥlata usbūʿan?"}, {"l": "Perempuan", "ar": "مَا رَأْيُكِ لَوْ أَجَّلْنَا الرِّحْلَةَ أُسْبُوعًا؟", "tr": "Mā raʾyuki law ajjalnā ar-riḥlata usbūʿan?"}], "id": "Bagaimana pendapatmu jika kita menunda perjalanan seminggu?", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1513", "v": [{"l": "", "ar": "أَنَا لَسْتُ مُتَأَكِّدًا مِنْ صِحَّةِ هَذِهِ الْمَعْلُومَةِ.", "tr": "Anā lastu mutaʾakkidan min ṣiḥḥati hādhihi al-maʿlūmati."}], "id": "Saya tidak yakin akan kebenaran informasi ini.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1514", "v": [{"l": "", "ar": "رُبَّمَا كُنْتَ مُحِقًّا فِي ذَلِكَ.", "tr": "Rubbamā kunta muḥiqqan fī dhālika."}], "id": "Mungkin kamu benar soal itu.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1515", "v": [{"l": "", "ar": "هَذَا لَا يَعْنِي أَنَّهُ خَطَأٌ بِالضَّرُورَةِ.", "tr": "Hādhā lā yaʿnī annahu khaṭaʾun bi-ḍ-ḍarūrati."}], "id": "Itu belum tentu berarti salah.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1516", "v": [{"l": "", "ar": "الْأَمْرُ يَعْتَمِدُ عَلَى الظُّرُوفِ.", "tr": "Al-amru yaʿtamidu ʿalā aẓ-ẓurūfi."}], "id": "Itu tergantung keadaan.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1517", "v": [{"l": "", "ar": "أَعْتَقِدُ أَنَّ الْجَمِيعَ يَسْتَحِقُّ فُرْصَةً ثَانِيَةً.", "tr": "Aʿtaqidu anna al-jamīʿa yastaḥiqqu furṣatan thāniyatan."}], "id": "Saya yakin semua orang berhak mendapat kesempatan kedua.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1518", "v": [{"l": "", "ar": "مِنَ الصَّعْبِ أَنْ أَحْكُمَ قَبْلَ أَنْ أُجَرِّبَ بِنَفْسِي.", "tr": "Mina aṣ-ṣaʿbi an aḥkuma qabla an ujarriba bi-nafsī."}], "id": "Sulit bagi saya menilai sebelum mencoba sendiri.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1519", "v": [{"l": "", "ar": "صَحِيحٌ أَنَّهُ غَالٍ، لَكِنَّهُ يَسْتَحِقُّ ذَلِكَ.", "tr": "Ṣaḥīḥun annahu ghālin, lakinnahu yastaḥiqqu dhālika."}], "id": "Memang mahal, tapi pantas dengan harganya.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1520", "v": [{"l": "", "ar": "لَا أَظُنُّ أَنَّ هَذَا هُوَ الْوَقْتُ الْمُنَاسِبُ.", "tr": "Lā aẓunnu anna hādhā huwa al-waqtu al-munāsibu."}], "id": "Saya kira ini bukan waktu yang tepat.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1521", "v": [{"l": "", "ar": "أَتَّفِقُ مَعَكَ فِي الْجُزْءِ الْأَوَّلِ فَقَطْ.", "tr": "Attafiqu maʿaka fī al-juzʾi al-awwali faqaṭ."}], "id": "Saya sependapat denganmu hanya pada bagian pertama.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1522", "v": [{"l": "", "ar": "فِي النِّهَايَةِ، الْقَرَارُ قَرَارُكَ.", "tr": "Fī an-nihāyati, al-qarāru qarāruka."}], "id": "Pada akhirnya, keputusan ada di tanganmu.", "aid": "", "aar": "", "bid": "", "bar": ""}]}, "2": {"ar": "الأسباب والنتائج", "id": "Sebab dan Akibat", "items": [{"n": "1523", "v": [{"l": "", "ar": "تَأَخَّرْتُ لِأَنَّ الطَّرِيقَ كَانَ مُغْلَقًا بِسَبَبِ حَادِثٍ.", "tr": "Taʾakhkhartu li-anna aṭ-ṭarīqa kāna mughlaqan bi-sababi ḥādithin."}], "id": "Saya terlambat karena jalan ditutup akibat kecelakaan.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1524", "v": [{"l": "", "ar": "نَتِيجَةً لِذَلِكَ، أُلْغِيَتِ الرِّحْلَةُ.", "tr": "Natījatan li-dhālika, ulghiyati ar-riḥlatu."}], "id": "Akibatnya, perjalanan dibatalkan.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1525", "v": [{"l": "", "ar": "لِهَذَا السَّبَبِ قَرَّرْتُ أَنْ أَبْقَى.", "tr": "Li-hādhā as-sababi qarrartu an abqā."}], "id": "Karena alasan itu saya memutuskan untuk tinggal.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1526", "v": [{"l": "", "ar": "كَيْ أَنْجَحَ يَجِبُ أَنْ أَعْمَلَ بِجِدٍّ.", "tr": "Kay anjaḥa yajibu an aʿmala bi-jiddin."}], "id": "Agar berhasil, saya harus bekerja keras.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1527", "v": [{"l": "", "ar": "دَرَسْتُ كَثِيرًا حَتَّى أَنْجَحَ فِي الِامْتِحَانِ.", "tr": "Darastu kathīran ḥattā anjaḥa fī al-imtiḥāni."}], "id": "Saya belajar banyak sampai lulus ujian.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1528", "v": [{"l": "", "ar": "بِسَبَبِ الْمَطَرِ لَمْ نَسْتَطِعِ الْخُرُوجَ.", "tr": "Bi-sababi al-maṭari lam nastaṭiʿi al-khurūja."}], "id": "Karena hujan, kami tidak bisa keluar.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1529", "v": [{"l": "", "ar": "لَوْلَا مُسَاعَدَتُكَ لَمَا أَنْهَيْتُ الْعَمَلَ.", "tr": "Lawlā musāʿadatuka lamā anhaytu al-ʿamala."}], "id": "Kalau bukan karena bantuanmu, saya tidak akan menyelesaikan pekerjaan.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1530", "v": [{"l": "", "ar": "لَوْ كُنْتُ أَعْرِفُ لَأَخْبَرْتُكَ.", "tr": "Law kuntu aʿrifu la-akhbartuka."}], "id": "Andai saya tahu, pasti saya beri tahu.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1531", "v": [{"l": "", "ar": "لَوْ دَرَسْتَ أَكْثَرَ لَنَجَحْتَ.", "tr": "Law darasta akthara la-najaḥta."}], "id": "Andai kamu belajar lebih banyak, pasti kamu lulus.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1532", "v": [{"l": "", "ar": "إِذَا لَمْ تَصِلْ فِي الْوَقْتِ فَسَنَذْهَبُ بِدُونِكَ.", "tr": "Idhā lam taṣil fī al-waqti fa-sa-nadhhabu bi-dūnika."}], "id": "Jika kamu tidak tiba tepat waktu, kami berangkat tanpamu.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1533", "v": [{"l": "", "ar": "مَعَ أَنَّ الْجَوَّ سَيِّئٌ، سَنَذْهَبُ.", "tr": "Maʿa anna al-jawwa sayyiʾun, sa-nadhhabu."}], "id": "Meskipun cuacanya buruk, kami akan pergi.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1534", "v": [{"l": "", "ar": "رَغْمَ التَّعَبِ، وَاصَلْتُ الْعَمَلَ.", "tr": "Raghma at-taʿabi, wāṣaltu al-ʿamala."}], "id": "Meski capek, saya terus bekerja.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1535", "v": [{"l": "", "ar": "بَيْنَمَا كُنْتُ أَنْتَظِرُ، قَرَأْتُ كِتَابًا.", "tr": "Baynamā kuntu antaẓiru, qaraʾtu kitāban."}], "id": "Sambil menunggu, saya membaca buku.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1536", "v": [{"l": "", "ar": "فَهِمْتُ الْآنَ لِمَاذَا غَضِبَ.", "tr": "Fahimtu al-āna limādhā ghaḍiba."}], "id": "Sekarang saya mengerti kenapa dia marah.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1537", "v": [{"l": "", "ar": "السَّبَبُ الرَّئِيسِيُّ هُوَ قِلَّةُ الْخِبْرَةِ.", "tr": "As-sababu ar-raʾīsiyyu huwa qillatu al-khibrati."}], "id": "Penyebab utamanya adalah kurangnya pengalaman.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1538", "v": [{"l": "", "ar": "هَذَا يُفَسِّرُ لِمَاذَا تَأَخَّرَ.", "tr": "Hādhā yufassiru limādhā taʾakhkhara."}], "id": "Ini menjelaskan kenapa dia terlambat.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1539", "v": [{"l": "", "ar": "نَتَجَ عَنْ ذَلِكَ مُشْكِلَةٌ كَبِيرَةٌ.", "tr": "Nataja ʿan dhālika mushkilatun kabīratun."}], "id": "Akibat itu muncul masalah besar.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1540", "v": [{"l": "", "ar": "لِذَلِكَ يَجِبُ أَنْ نَكُونَ حَذِرِينَ.", "tr": "Li-dhālika yajibu an nakūna ḥadhirīna."}], "id": "Karena itu kita harus berhati-hati.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1541", "v": [{"l": "", "ar": "فَقَطْ لِأَنَّهُ صَغِيرٌ لَا يَعْنِي أَنَّهُ لَا يَفْهَمُ.", "tr": "Faqaṭ li-annahu ṣaghīrun lā yaʿnī annahu lā yafhamu."}], "id": "Hanya karena dia kecil bukan berarti dia tidak paham.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1542", "v": [{"l": "", "ar": "عَلَى الرَّغْمِ مِنْ كُلِّ شَيْءٍ، أَنَا مُتَفَائِلٌ.", "tr": "ʿAlā ar-raghmi min kulli shayʾin, anā mutafāʾilun."}], "id": "Terlepas dari segalanya, saya optimis.", "aid": "", "aar": "", "bid": "", "bar": ""}]}, "3": {"ar": "التجارب والخبرات", "id": "Pengalaman", "items": [{"n": "1543", "v": [{"l": "", "ar": "مَرَرْتُ بِتَجْرِبَةٍ لَنْ أَنْسَاهَا.", "tr": "Marartu bi-tajribatin lan ansāhā."}], "id": "Saya mengalami pengalaman yang tidak akan saya lupakan.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1544", "v": [{"l": "", "ar": "تَعَلَّمْتُ مِنْ هَذِهِ التَّجْرِبَةِ دَرْسًا مُهِمًّا.", "tr": "Taʿallamtu min hādhihi at-tajribati darsan muhimman."}], "id": "Saya belajar pelajaran penting dari pengalaman ini.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1545", "v": [{"l": "", "ar": "عِنْدَمَا انْتَقَلْتُ إِلَى بَلَدٍ جَدِيدٍ شَعَرْتُ بِالْغُرْبَةِ.", "tr": "ʿIndamā intaqaltu ilā baladin jadīdin shaʿartu bi-l-ghurbati."}], "id": "Ketika pindah ke negara baru, saya merasa asing.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1546", "v": [{"l": "", "ar": "اسْتَغْرَقَ الْأَمْرُ مِنِّي شَهْرًا حَتَّى اعْتَدْتُ عَلَيْهِ.", "tr": "Istaghraqa al-amru minnī shahran ḥattā iʿtadtu ʿalayhi."}], "id": "Saya butuh sebulan sampai terbiasa.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1547", "v": [{"l": "", "ar": "لَقَدْ مَرَّتْ عَلَيَّ لَحَظَاتٌ صَعْبَةٌ لَكِنَّهَا عَلَّمَتْنِي الصَّبْرَ.", "tr": "Laqad marrat ʿalayya laḥaẓātun ṣaʿbatun lakinnahā ʿallamatnī aṣ-ṣabra."}], "id": "Saya melewati saat-saat sulit, tapi itu mengajarkan saya kesabaran.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1548", "v": [{"l": "", "ar": "كُنْتُ أَظُنُّ أَنَّ الْأَمْرَ سَهْلٌ، لَكِنَّنِي كُنْتُ مُخْطِئًا.", "tr": "Kuntu aẓunnu anna al-amra sahlun, lakinnanī kuntu mukhṭiʾan."}], "id": "Saya kira mudah, tapi ternyata saya keliru.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1549", "v": [{"l": "", "ar": "لَمْ أَتَوَقَّعْ أَنْ تَكُونَ الرِّحْلَةُ بِهَذَا الْجَمَالِ.", "tr": "Lam atawaqqaʿ an takūna ar-riḥlatu bi-hādhā al-jamāli."}], "id": "Saya tidak menyangka perjalanannya seindah ini.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1550", "v": [{"l": "", "ar": "أَوَّلُ مَرَّةٍ سَافَرْتُ فِيهَا وَحْدِي كَانَتْ مُخِيفَةً.", "tr": "Awwalu marratin sāfartu fīhā waḥdī kānat mukhīfatan."}], "id": "Pertama kali saya bepergian sendirian itu menakutkan.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1551", "v": [{"l": "", "ar": "تَعَرَّفْتُ هُنَاكَ عَلَى أَشْخَاصٍ مِنْ ثَقَافَاتٍ مُخْتَلِفَةٍ.", "tr": "Taʿarraftu hunāka ʿalā ashkhāṣin min thaqāfātin mukhtalifatin."}], "id": "Di sana saya berkenalan dengan orang dari budaya berbeda.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1552", "v": [{"l": "", "ar": "فَاتَتْنِي فُرْصَةٌ جَيِّدَةٌ لِأَنِّي تَرَدَّدْتُ.", "tr": "Fātatnī furṣatun jayyidatun li-annī taraddadtu."}], "id": "Saya kehilangan kesempatan bagus karena ragu.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1553", "v": [{"l": "", "ar": "نَدِمْتُ عَلَى مَا قُلْتُهُ.", "tr": "Nadimtu ʿalā mā qultuhu."}], "id": "Saya menyesali apa yang saya katakan.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1554", "v": [{"l": "", "ar": "أَنَا فَخُورٌ بِمَا حَقَّقْتُهُ حَتَّى الْآنَ.", "tr": "Anā fakhūrun bi-mā ḥaqqaqtuhu ḥattā al-āna."}], "id": "Saya bangga dengan apa yang telah saya capai sejauh ini.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1555", "v": [{"l": "", "ar": "لَوْ عَادَ بِيَ الزَّمَنُ لَفَعَلْتُ الشَّيْءَ نَفْسَهُ.", "tr": "Law ʿāda bī az-zamanu la-faʿaltu ash-shayʾa nafsahu."}], "id": "Andai waktu bisa diputar, saya akan melakukan hal yang sama.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1556", "v": [{"l": "", "ar": "سَبَقَ أَنْ عَمِلْتُ فِي مَجَالٍ مُشَابِهٍ.", "tr": "Sabaqa an ʿamiltu fī majālin mushābihin."}], "id": "Saya pernah bekerja di bidang yang serupa.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1557", "v": [{"l": "", "ar": "لَمْ يَسْبِقْ لِي أَنْ جَرَّبْتُ هَذَا الطَّعَامَ.", "tr": "Lam yasbiq lī an jarrabtu hādhā aṭ-ṭaʿāma."}], "id": "Saya belum pernah mencoba makanan ini.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1558", "v": [{"l": "", "ar": "مُنْذُ أَنْ بَدَأْتُ الدِّرَاسَةَ وَأَنَا أَتَحَسَّنُ.", "tr": "Mundhu an badaʾtu ad-dirāsata wa-anā ataḥassanu."}], "id": "Sejak mulai belajar, saya terus membaik.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1559", "v": [{"l": "", "ar": "كُنْتُ قَدْ نَسِيتُ الْمَوْضُوعَ تَمَامًا.", "tr": "Kuntu qad nasītu al-mawḍūʿa tamāman."}], "id": "Saya sudah benar-benar lupa soal itu.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1560", "v": [{"l": "", "ar": "بَعْدَ سَنَوَاتٍ مِنَ الْعَمَلِ قَرَّرْتُ أَنْ أُغَيِّرَ مَسَارِي.", "tr": "Baʿda sanawātin mina al-ʿamali qarrartu an ughayyira masārī."}], "id": "Setelah bertahun-tahun bekerja, saya memutuskan mengubah jalur karier.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1561", "v": [{"l": "", "ar": "كَانَتْ تِلْكَ أَفْضَلَ قَرَارَاتِي.", "tr": "Kānat tilka afḍala qarārātī."}], "id": "Itu keputusan terbaik saya.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1562", "v": [{"l": "", "ar": "شَاهَدْتُ شُرُوقَ الشَّمْسِ مِنْ قِمَّةِ الْجَبَلِ.", "tr": "Shāhadtu shurūqa ash-shamsi min qimmati al-jabali."}], "id": "Saya menyaksikan matahari terbit dari puncak gunung.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1563", "v": [{"l": "", "ar": "تَعَلَّمْتُ أَنْ أَعْتَمِدَ  "v": [{"l": "", "ar": "قَرَّرْتُ أَنْ أُمَارِسَ الرِّيَاضَةَ بِانْتِظَامٍ.", "tr": "Qarrartu an umārisa ar-riyāḍata bi-intiẓāmin."}], "id": "Saya memutuskan berolahraga secara teratur.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1572", "v": [{"l": "", "ar": "سَأَبْدَأُ مِنَ الْغَدِ لَا مِنَ الْأُسْبُوعِ الْقَادِمِ.", "tr": "Sa-abdaʾu mina al-ghadi lā mina al-usbūʿi al-qādimi."}], "id": "Saya akan mulai dari besok, bukan minggu depan.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1573", "v": [{"l": "", "ar": "عَلَيَّ أَنْ أُحَدِّدَ أَوْلَوِيَّاتِي.", "tr": "ʿAlayya an uḥaddida awlawiyyātī."}], "id": "Saya harus menentukan prioritas.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1574", "v": [{"l": "", "ar": "أَضَعُ خُطَّةً لِلْأَشْهُرِ الْقَادِمَةِ.", "tr": "Aḍaʿu khuṭṭatan lil-ashhuri al-qādimati."}], "id": "Saya menyusun rencana untuk bulan-bulan mendatang.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1575", "v": [{"l": "", "ar": "لَا بُدَّ أَنْ أَتَعَلَّمَ مَهَارَاتٍ جَدِيدَةً.", "tr": "Lā budda an ataʿallama mahārātin jadīdatan."}], "id": "Saya harus mempelajari keterampilan baru.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1576", "v": [{"l": "", "ar": "أَطْمَحُ إِلَى مَنْصِبٍ أَعْلَى فِي شَرِكَتِي.", "tr": "Aṭmaḥu ilā manṣibin aʿlā fī sharikatī."}], "id": "Saya mengincar posisi yang lebih tinggi di perusahaan saya.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1577", "v": [{"l": "", "ar": "بَعْدَ خَمْسِ سَنَوَاتٍ أَرَى نَفْسِي مُدِيرًا.", "tr": "Baʿda khamsi sanawātin arā nafsī mudīran."}], "id": "Lima tahun lagi saya melihat diri saya sebagai manajer.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1578", "v": [{"l": "", "ar": "إِذَا سَارَتِ الْأُمُورُ كَمَا خَطَّطْنَا فَسَنَفْتَتِحُ الْفَرْعَ قَرِيبًا.", "tr": "Idhā sārati al-umūru kamā khaṭṭaṭnā fa-sa-naftatiḥu al-farʿa qarīban."}], "id": "Jika semuanya berjalan sesuai rencana, kami akan segera membuka cabang.", "aid": "", "aar": "", "bid": "", "bar":  "", "aar": "", "bid": "", "bar": ""}, {"n": "1774", "v": [{"l": "", "ar": "قَالَ إِنَّهُ عَادَ مِنَ الْخَارِجِ مُنْذُ أُسْبُوعٍ.", "tr": "Qāla innahu ʿāda mina al-khāriji mundhu usbūʿin."}], "id": "Katanya dia pulang dari luar negeri seminggu lalu.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1775", "v": [{"l": "", "ar": "جَلَسْنَا فِي مَقْهًى قَرِيبٍ وَتَحَدَّثْنَا لِسَاعَاتٍ.", "tr": "Jalasnā fī maqhan qarībin wa-taḥaddathnā li-sāʿātin."}], "id": "Kami duduk di kafe terdekat dan mengobrol berjam-jam.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1776", "v": [{"l": "", "ar": "ثُمَّ تَذَكَّرْتُ أَنَّ لَدَيَّ مَوْعِدًا مُهِمًّا.", "tr": "Thumma tadhakkartu anna ladayya mawʿidan muhimman."}], "id": "Lalu saya teringat saya punya janji penting.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1777", "v": [{"l": "", "ar": "رَكَضْتُ إِلَى الْمَحَطَّةِ وَأَنَا أَلْهَثُ.", "tr": "Rakaḍtu ilā al-maḥaṭṭati wa-anā alhathu."}], "id": "Saya berlari ke stasiun sambil terengah-engah.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1778", "v": [{"l": "", "ar": "وَصَلْتُ فِي اللَّحْظَةِ الْأَخِيرَةِ تَقْرِيبًا.", "tr": "Waṣaltu fī al-laḥẓati al-akhīrati taqrīban."}], "id": "Saya tiba hampir di detik terakhir.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1779", "v": [{"l": "", "ar": "وَمَا إِنْ جَلَسْتُ حَتَّى تَحَرَّكَ الْقِطَارُ.", "tr": "Wa-mā in jalastu ḥattā taḥarraka al-qiṭāru."}], "id": "Begitu saya duduk, kereta pun berjalan.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1780", "v": [{"l": "", "ar": "كَانَ الْيَوْمُ طَوِيلًا وَمُمْتِعًا فِي آنٍ وَاحِدٍ.", "tr": "Kāna al-yawmu ṭawīlan wa-mumtiʿan fī ānin wāḥidin."}], "id": "Hari itu panjang dan menyenangkan sekaligus.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1781", "v": [{"l": "", "ar": "حِينَمَا كُنْتُ طِفْلًا، كَانَتْ جَدَّتِي تَحْكِي لِي قِصَصًا قَبْلَ النَّوْمِ.", "tr": "Ḥīnamā kuntu ṭiflan, kānat jaddatī taḥkī lī qiṣaṣan qabla an-nawmi."}], "id": "Ketika saya kecil, nenek saya biasa menceritakan kisah sebelum tidur.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1782", "v": [{"l": "", "ar": "كُنَّا نَجْتَمِعُ حَوْلَهَا وَنَسْتَمِعُ بِشَوْقٍ.", "tr": "Kunnā najtamiʿu ḥawlahā wa-nastamiʿu bi-shawqin."}], "id": "Kami berkumpul di sekelilingnya dan mendengarkan dengan antusias.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1783", "v": [{"l": "", "ar": "وَفِي نِهَايَةِ كُلِّ قِصَّةٍ كَانَتْ تَقُولُ لَنَا حِكْمَةً.", "tr": "Wa-fī nihāyati kulli qiṣṣatin kānat taqūlu lanā ḥikmatan."}], "id": "Dan di akhir setiap kisah, dia menyampaikan sebuah hikmah kepada kami.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1784", "v": [{"l": "", "ar": "مَا زِلْتُ أَتَذَكَّرُ صَوْتَهَا الدَّافِئَ.", "tr": "Mā ziltu atadhakkaru ṣawtahā ad-dāfiʾa."}], "id": "Saya masih mengingat suaranya yang hangat.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1785", "v": [{"l": "", "ar": "ذَاتَ مَرَّةٍ، ضَاعَ مِنِّي كَلْبِي فِي الْغَابَةِ.", "tr": "Dhāta marratin, ḍāʿa minnī kalbī fī al-ghābati."}], "id": "Suatu kali, anjing saya hilang di hutan.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1786", "v": [{"l": "", "ar": "بَحَثْنَا عَنْهُ حَتَّى الْمَسَاءِ دُونَ فَائِدَةٍ.", "tr": "Baḥathnā ʿanhu ḥattā al-masāʾi dūna fāʾidatin."}], "id": "Kami mencarinya sampai sore tanpa hasil.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1787", "v": [{"l": "", "ar": "وَفِي الصَّبَاحِ التَّالِي، وَجَدْنَاهُ أَمَامَ الْبَابِ.", "tr": "Wa-fī aṣ-ṣabāḥi at-tālī, wajadnāhu amāma al-bābi."}], "id": "Keesokan paginya, kami menemukannya di depan pintu.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1788", "v": [{"l": "", "ar": "كَانَتْ فَرْحَتُنَا لَا تُوصَفُ.", "tr": "Kānat farḥatunā lā tūṣafu."}], "id": "Kegembiraan kami tak terlukiskan.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1789", "v": [{"l": "", "ar": "وَهَكَذَا انْتَهَتِ الْقِصَّةُ بِسَلَامٍ.", "tr": "Wa-hākadhā intahati al-qiṣṣatu bi-salāmin."}], "id": "Demikianlah kisahnya berakhir dengan selamat.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1790", "v": [{"l": "", "ar": "لَقَدْ تَعَلَّمْتُ مِنْ تِلْكَ الْحَادِثَةِ أَلَّا أَتْرُكَ شَيْئًا ثَمِينًا بِلَا مُرَاقَبَةٍ.", "tr": "Laqad taʿallamtu min tilka al-ḥādithati allā atruka shayʾan thamīnan bi-lā murāqabatin."}], "id": "Saya belajar dari kejadian itu untuk tidak meninggalkan barang berharga tanpa pengawasan.", "aid": "", "aar": "", "bid": "", "bar": ""}]}, "17": {"ar": "الوصف التفصيلي", "id": "Deskripsi Rinci", "items": [{"n": "1791", "v": [{"l": "", "ar": "تَقَعُ الْقَرْيَةُ عَلَى سَفْحِ جَبَلٍ تُحِيطُ بِهِ الْغَابَاتُ.", "tr": "Taqaʿu al-qaryatu ʿalā safḥi jabalin tuḥīṭu bihi al-ghābātu."}], "id": "Desa itu terletak di lereng gunung yang dikelilingi hutan.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1792", "v": [{"l": "", "ar": "بُيُوتُهَا صَغِيرَةٌ وَمَبْنِيَّةٌ مِنَ الْحَجَرِ.", "tr": "Buyūtuhā ṣaghīratun wa-mabniyyatun mina al-ḥajari."}], "id": "Rumah-rumahnya kecil dan terbuat dari batu.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1793", "v": [{"l": "", "ar": "يَتَمَيَّزُ سُكَّانُهَا بِالْكَرَمِ وَالْبَسَاطَةِ.", "tr": "Yatamayyazu sukkānuhā bi-l-karami wa-l-basāṭati."}], "id": "Penduduknya dikenal ramah dan sederhana.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1794", "v": [{"l": "", "ar": "الْهَوَاءُ هُنَاكَ نَقِيٌّ وَالْجَوُّ مُنْعِشٌ.", "tr": "Al-hawāʾu hunāka naqiyyun wa-l-jawwu munʿishun."}], "id": "Udara di sana bersih dan cuacanya menyegarkan.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1795", "v": [{"l": "", "ar": "هِيَ امْرَأَةٌ هَادِئَةُ الطَّبْعِ، قَوِيَّةُ الشَّخْصِيَّةِ.", "tr": "Hiya imraʾatun hādiʾatu aṭ-ṭabʿi, qawiyyatu ash-shakhṣiyyati."}], "id": "Dia perempuan yang berperangai tenang dan berkepribadian kuat.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1796", "v": [{"l": "", "ar": "تَتَحَدَّثُ بِبُطْءٍ وَتَخْتَارُ كَلِمَاتِهَا بِعِنَايَةٍ.", "tr": "Tataḥaddathu bi-buṭʾin wa-takhtāru kalimātihā bi-ʿināyatin."}], "id": "Dia berbicara pelan dan memilih kata-katanya dengan hati-hati.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1797", "v": [{"l": "", "ar": "يُعْرَفُ عَنْهَا حُبُّهَا لِلنِّظَامِ وَالدِّقَّةِ.", "tr": "Yuʿrafu ʿanhā ḥubbuhā lil-niẓāmi wa-d-diqqati."}], "id": "Dia dikenal menyukai keteraturan dan ketelitian.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1798", "v": [{"l": "", "ar": "كَانَ جَدِّي رَجُلًا طَوِيلَ الْقَامَةِ، عَرِيضَ الْكَتِفَيْنِ.", "tr": "Kāna jaddī rajulan ṭawīla al-qāmati, ʿarīḍa al-katifayni."}], "id": "Kakek saya seorang pria tinggi dan berbahu lebar.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1799", "v": [{"l": "", "ar": "ابْتِسَامَتُهُ لَا تُفَارِقُ وَجْهَهُ.", "tr": "Ibtisāmatuhu lā tufāriqu wajhahu."}], "id": "Senyumnya tak pernah lepas dari wajahnya.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1800", "v": [{"l": "", "ar": "الْغُرْفَةُ مُضَاءَةٌ بِنُورٍ خَافِتٍ يُضْفِي عَلَيْهَا دِفْئًا.", "tr": "Al-ghurfatu muḍāʾatun bi-nūrin khāfitin yuḍfī ʿalayhā difʾan."}], "id": "Ruangan itu diterangi cahaya redup yang memberinya kehangatan.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1801", "v": [{"l": "", "ar": "تَتَوَسَّطُ الْمَكَانَ طَاوِلَةٌ خَشَبِيَّةٌ قَدِيمَةٌ.", "tr": "Tatawassaṭu al-makāna ṭāwilatun khashabiyyatun qadīmatun."}], "id": "Di tengah tempat itu ada sebuah meja kayu tua.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1802", "v": [{"l": "", "ar": "عَلَى الْجُدْرَانِ لَوْحَاتٌ تَحْكِي تَارِيخَ الْعَائِلَةِ.", "tr": "ʿAlā al-judrāni lawḥātun taḥkī tārīkha al-ʿāʾilati."}], "id": "Di dinding ada lukisan yang menceritakan sejarah keluarga.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1803", "v": [{"l": "", "ar": "رَائِحَةُ الْقَهْوَةِ تَمْلَأُ الْمَكَانَ.", "tr": "Rāʾiḥatu al-qahwati tamlaʾu al-makāna."}], "id": "Aroma kopi memenuhi tempat itu.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1804", "v": [{"l": "", "ar": "الْمَقْهَى يَعُجُّ بِالزَّبَائِنِ فِي الْمَسَاءِ.", "tr": "Al-maqhā yaʿujju bi-z-zabāʾini fī al-masāʾi."}], "id": "Kafe itu ramai pengunjung di malam hari.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1805", "v": [{"l": "", "ar": "تَبْدُو الْمَدِينَةُ مِنْ بَعِيدٍ كَلَوْحَةٍ مُضِيئَةٍ.", "tr": "Tabdū al-madīnatu min baʿīdin ka-lawḥatin muḍīʾatin."}], "id": "Dari kejauhan kota tampak seperti lukisan bercahaya.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1806", "v": [{"l": "", "ar": "هُوَ شَخْصٌ يُحِبُّ الْمُغَامَرَةَ وَلَا يَخَافُ الْمَجْهُولَ.", "tr": "Huwa shakhṣun yuḥibbu al-mughāmarata wa-lā yakhāfu al-majhūla."}], "id": "Dia orang yang suka petualangan dan tak takut pada hal yang tak diketahui.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1807", "v": [{"l": "", "ar": "كُلُّ مَنْ يَعْرِفُهُ يَصِفُهُ بِالصِّدْقِ وَالْأَمَانَةِ.", "tr": "Kullu man yaʿrifuhu yaṣifuhu bi-ṣ-ṣidqi wa-l-amānati."}], "id": "Semua yang mengenalnya menyebutnya jujur dan amanah.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1808", "v": [{"l": "", "ar": "الْمَنْظَرُ مِنْ هُنَا يَسْلُبُ الْأَنْفَاسَ.", "tr": "Al-manẓaru min hunā yaslubu al-anfāsa."}], "id": "Pemandangan dari sini memukau.", "aid": "", "aar": "", "bid": "", "bar": ""}]}, "18": {"ar": "الشكاوى والتفاوض", "id": "Keluhan dan Negosiasi", "items": [{"n": "1809", "v": [{"l": "", "ar": "أَوَدُّ أَنْ أُقَدِّمَ شَكْوَى بِخُصُوصِ الْخِدْمَةِ الَّتِي تَلَقَّيْتُهَا.", "tr": "Awaddu an uqaddima shakwā bi-khuṣūṣi al-khidmati allatī talaqqaytuhā."}], "id": "Saya ingin mengajukan keluhan tentang layanan yang saya terima.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1810", "v": [{"l": "", "ar": "لَمْ يَكُنِ الْمُنْتَجُ مُطَابِقًا لِلْوَصْفِ.", "tr": "Lam yakuni al-muntaju muṭābiqan lil-waṣfi."}], "id": "Barangnya tidak sesuai dengan deskripsi.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1811", "v": [{"l": "", "ar": "أَطْلُبُ اسْتِرْدَادَ الْمَبْلَغِ أَوْ اسْتِبْدَالَ الْقِطْعَةِ.", "tr": "Aṭlubu istirdāda al-mablaghi aw istibdāla al-qiṭʿati."}], "id": "Saya minta uang dikembalikan atau barang diganti.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1812", "v": [{"l": "", "ar": "نَعْتَذِرُ عَنِ الْإِزْعَاجِ وَسَنَعْمَلُ عَلَى حَلِّ الْمُشْكِلَةِ فَوْرًا.", "tr": "Naʿtadhiru ʿani al-izʿāji wa-sa-naʿmalu ʿalā ḥalli al-mushkilati fawran."}], "id": "Kami mohon maaf atas ketidaknyamanan dan akan segera menyelesaikan masalah.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1813", "v": [{"l": "", "ar": "هَلْ يُمْكِنُ أَنْ نَصِلَ إِلَى حَلٍّ وَسَطٍ؟", "tr": "Hal yumkinu an naṣila ilā ḥallin wasaṭin?"}], "id": "Bisakah kita mencapai jalan tengah?", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1814", "v": [{"l": "", "ar": "أَنَا مُسْتَعِدٌّ لِلتَّنَازُلِ عَنْ بَعْضِ الشُّرُوطِ.", "tr": "Anā mustaʿiddun lil-tanāzuli ʿan baʿḍi ash-shurūṭi."}], "id": "Saya bersedia mengalah pada sebagian syarat.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1815", "v": [{"l": "", "ar": "لَنْ أُوَافِقَ إِلَّا إِذَا تَمَّ تَعْدِيلُ الْعَقْدِ.", "tr": "Lan uwāfiqa illā idhā tamma taʿdīlu al-ʿaqdi."}], "id": "Saya tidak akan setuju kecuali kontrak diubah.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1816", "v": [{"l": "", "ar": "السِّعْرُ الَّذِي عَرَضْتُمُوهُ أَعْلَى مِنْ مِيزَانِيَّتِنَا.", "tr": "As-siʿru alladhī ʿaraḍtumūhu aʿlā min mīzāniyyatinā."}], "id": "Harga yang Anda tawarkan di atas anggaran kami.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1817", "v": [{"l": "", "ar": "نَحْنُ نُقَدِّرُ عَرْضَكُمْ لَكِنَّنَا نَحْتَاجُ إِلَى تَخْفِيضٍ.", "tr": "Naḥnu nuqaddiru ʿarḍakum lakinnanā naḥtāju ilā takhfīḍin."}], "id": "Kami menghargai tawaran Anda tapi kami butuh potongan harga.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1818", "v": [{"l": "", "ar": "إِذَا قَبِلْتُمْ بِهَذَا الشَّرْطِ فَسَنُوَقِّعُ الْيَوْمَ.", "tr": "Idhā qabiltum bi-hādhā ash-sharṭi fa-sa-nuwaqqiʿu al-yawma."}], "id": "Jika Anda menerima syarat ini, kami tanda tangan hari ini.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1819", "v": [{"l": "", "ar": "حَدَثَ سُوءُ فَهْمٍ بَيْنَنَا وَيَجِبُ أَنْ نُوَضِّحَهُ.", "tr": "Ḥadatha sūʾu fahmin baynanā wa-yajibu an nuwaḍḍiḥahu."}], "id": "Terjadi salah paham di antara kita dan kita harus meluruskannya.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1820", "v": [{"l": "", "ar": "لَمْ أَقْصِدْ أَنْ أَجْرَحَ مَشَاعِرَكَ.", "tr": "Lam aqṣid an ajraḥa mashāʿiraka."}], "id": "Saya tidak bermaksud melukai perasaanmu.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1821", "v": [{"l": "", "ar": "أَتَفَهَّمُ مَوْقِفَكَ لَكِنَّ لِي وِجْهَةَ نَظَرٍ أُخْرَى.", "tr": "Atafahhamu mawqifaka lakinna lī wijhata naẓarin ukhrā."}], "id": "Saya memahami posisimu tapi saya punya sudut pandang lain.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1822", "v": [{"l": "", "ar": "دَعْنَا نَتَحَدَّثْ بِهُدُوءٍ وَنَبْحَثْ عَنْ حَلٍّ.", "tr": "Daʿnā nataḥaddath bi-hudūʾin wa-nabḥath ʿan ḥallin."}], "id": "Mari bicara dengan tenang dan mencari solusi.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1823", "v": [{"l": "", "ar": "لَا فَائِدَةَ مِنَ الْجِدَالِ إِذَا لَمْ نَسْتَمِعْ لِبَعْضِنَا.", "tr": "Lā fāʾidata mina al-jidāli idhā lam nastamiʿ li-baʿḍinā."}], "id": "Tak ada gunanya berdebat jika kita tak saling mendengarkan.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1824", "v": [{"l": "", "ar": "يَبْدُو أَنَّ هُنَاكَ خَطَأً فِي الْحِسَابِ.", "tr": "Yabdū anna hunāka khaṭaʾan fī al-ḥisābi."}], "id": "Sepertinya ada kesalahan hitung.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1825", "v": [{"l": "", "ar": "طَلَبْتُ مِنْهُمْ أَنْ يُعِيدُوا النَّظَرَ فِي الْقَرَارِ.", "tr": "Ṭalabtu minhum an yuʿīdū an-naẓara fī al-qarāri."}], "id": "Saya meminta mereka meninjau kembali keputusan itu.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1826", "v": [{"l": "", "ar": "رَفَضُوا طَلَبِي بِحُجَّةِ أَنَّ الْمُدَّةَ انْتَهَتْ.", "tr": "Rafaḍū ṭalabī bi-ḥujjati anna al-muddata intahat , "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1834", "v": [{"l": "", "ar": "يَجِبُ أَنْ نَتَّفِقَ عَلَى جَدْوَلٍ زَمَنِيٍّ وَاضِحٍ.", "tr": "Yajibu an nattafiqa ʿalā jadwalin zamaniyyin wāḍiḥin."}], "id": "Kita harus sepakat pada jadwal yang jelas.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1835", "v": [{"l": "", "ar": "سَنَنْطَلِقُ فِي السَّادِسَةِ صَبَاحًا وَلَنْ نَنْتَظِرَ أَحَدًا.", "tr": "Sa-nanṭaliqu fī as-sādisati ṣabāḥan wa-lan nantaẓira aḥadan."}], "id": "Kita berangkat jam enam pagi dan tidak akan menunggu siapa pun.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1836", "v": [{"l": "", "ar": "مَنْ سَيَتَوَلَّى الْإِشْرَافَ عَلَى الْحَجْزِ؟", "tr": "Man sa-yatawallā al-ishrāfa ʿalā al-ḥajzi?"}], "id": "Siapa yang akan menangani pemesanan?", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1837", "v": [{"l": "", "ar": "تَطَوَّعْتُ لِلتَّنْسِيقِ مَعَ الْفُنْدُقِ.", "tr": "Taṭawwaʿtu lil-tansīqi maʿa al-funduqi."}], "id": "Saya menawarkan diri berkoordinasi dengan hotel.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1838", "v": [{"l": "", "ar": "أَرْسِلُوا لِي أَسْمَاءَكُمْ قَبْلَ يَوْمِ الْخَمِيسِ.", "tr": "Arsilū lī asmāʾakum qabla yawmi al-khamīsi."}], "id": "Kirimkan nama-nama Anda kepada saya sebelum hari Kamis.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1839", "v": [{"l": "", "ar": "قَدْ نُضْطَرُّ إِلَى تَغْيِيرِ الْمَوْعِدِ إِنْ سَاءَ الطَّقْسُ.", "tr": "Qad nuḍṭarru ilā taghyīri al-mawʿidi in sāʾa aṭ-ṭaqsu."}], "id": "Kita mungkin terpaksa mengubah jadwal jika cuaca memburuk.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1840", "v": [{"l": "", "ar": "سَنُوَزِّعُ الْمُهِمَّاتِ بِالْعَدْلِ بَيْنَ الْجَمِيعِ.", "tr": "Sa-nuwazziʿu al-muhimmāti bi-l-ʿadli bayna al-jamīʿi."}], "id": "Kita akan membagi tugas secara adil kepada semua.", "aid": "", "aar": "", "bid": "", "bar": ""}, {"n": "1841", "v": [{"l": "", "ar": "تَمَّتِ الْمُوَافَقَةُ عَلَى خُطَّةِ الرِّحْلَةِ بِالْإِجْمَاعِ.", "tr": "Tammati al-muw let token=0,curAudio=null,voice=null,rate=0.85,auto=true;
function pickVoice(){const v=speechSynthesis.getVoices();voice=v.find(x=>/^ar/i.test(x.lang))||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function stopAudio(){token++;try{speechSynthesis.cancel()}catch(e){}if(curAudio){try{curAudio.pause()}catch(e){}curAudio=null}document.querySelectorAll('.spk.play').forEach(e=>e.classList.remove('play'))}
function tts(text){return new Promise(res=>{
  if(!('speechSynthesis' in window)){res();return}
  const u=new SpeechSynthesisUtterance(text.replace(/[،؟]/g,' '));u.lang='ar-SA';if(voice)u.voice=voice;u.rate=rate;
  let done=false;const fin=()=>{if(!done){done=true;res()}};u.onend=fin;u.onerror=fin;setTimeout(fin,15000);
  speechSynthesis.speak(u);
  if(!voice&&!speechSynthesis.getVoices().length)$('#warn').textContent='';
})}
function playKey(key,text){return new Promise(res=>{
  let fell=false;const fb=()=>{if(fell)return;fell=true;tts(text).then(res)};
  const a=new Audio('audio/'+key+'.mp3');a.playbackRate=rate;curAudio=a;a.onerror=fb;a.onended=()=>res();
  const p=a.play();if(p&&p.catch)p.catch(fb);
})}
async function speak(key,text,btn){stopAudio();const my=token;if(btn)btn.classList.add('play');await playKey(key,text);if(btn&&my===token)btn.classList.remove('play')}
async function seq(list){stopAudio();const my=token;for(const [k,t,b] of list){if(my!==token)return;const btn=b?document.getElementById(b):null;if(btn)btn.classList.add('play');await playKey(k,t);if(btn)btn.classList.remove('play');await new Promise(r=>setTimeout(r,350))}}
window.sp=(k,t,id)=>speak(k,t,document.getElementById(id));

const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/'/g,'&#39;').replace(/"/g,'&quot;');
function head(title,ribbon){return `<div class="pill">${title}</div><div class="banner"><div class="logo">${LOGO}</div><div class="t1">العربية الفصحى</div><div class="t2">AL-FUSHA ACADEMY</div></div><div class="badge"><div class="c">B1</div><div class="p">Menengah</div></div>${ribbon?`<div class="ribbon">${ribbon}</div>`:''}`}
function nav(prev,next,pl,nl){return `<button class="nbtn" style="left:50px" onclick="${prev}"><i>←</i>${pl}</button>${next?`<button class="nbtn" style="right:50px;flex-direction:row-reverse" onclick="${next}"><i>→</i>${nl}</button>`:''}`}
function speaker(id,key,text){return `<button class="spk" id="${id}" onclick="sp('${key}','${esc(text).replace(/\\/g,'')}','${id}')">${SPK}</button>`}
function tools(){return `<div id="tools"><div class="tool">Kecepatan · السرعة<div class="row"><button class="${rate==0.6?'on':''}" onclick="setRate(0.6)">🐢</button><button class="${rate==0.85?'on':''}" onclick="setRate(0.85)">🙂</button><button class="${rate==1?'on':''}" onclick="setRate(1)">🐇</button></div></div><div class="tool">Otomatis · تلقائي<div class="row"><button class="${auto?'on':''}" onclick="setAuto(true)">ON</button><button class="${!auto?'on':''}" onclick="setAuto(false)">OFF</button></div></div></div>`}
window.setRate=r=>{rate=r;render()};window.setAuto=a=>{auto=a;render(true)};

/* ---------- state ---------- */
let S={v:'hub',t:0,i:0};
function slides(t){
  const T=D.topics[t],L=[{k:'cover'}];
  T.items.forEach((it,j)=>{L.push({k:'s',j});if(it.aar)L.push({k:'d',j})});
  L.push({k:'end'});return L;
}
function go(h){location.hash=h}
function parse(){
  const h=location.hash.slice(1)||'hub';
  if(h==='hub'||h==='lessons'||h==='quizzes')S={v:h};
  else{const m=h.match(/^t(\d+)\/(\d+)$/);if(m)S={v:'t',t:+m[1],i:+m[2]};else S={v:'hub'}}
  render();
}
addEventListener('hashchange',parse);

function render(keep){
  if(!keep)stopAudio();
  let h='';
  if(S.v==='hub'){
    h=head('B1<small>Pilih menu</small>','Level B1 · Menengah — Pilih menu belajar')+
    `<a class="hcard" style="left:290px" href="#lessons"><div class="ic"><svg viewBox="0 0 64 64"><path d="M8 14q12-4 24 4q12-8 24-4v38q-12-4-24 4q-12-8-24-4z" fill="#fff"/><path d="M32 18v38" stroke="#076756" stroke-width="3"/></svg></div><div class="a">الدروس</div><div class="i">PELAJARAN</div><div class="s">Slide kalimat + Latin + arti + audio</div></a>
     <a class="hcard" style="left:1010px" href="#quizzes"><div class="ic"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="#fff"/><path d="M19 33l9 9 18-20" stroke="#076756" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="a">الاختبارات</div><div class="i">KUIS</div><div class="s">Latihan interaktif per topik</div></a>
     <div id="hint">Listen • Repeat • Understand • Use</div>`;
  }else if(S.v==='lessons'||S.v==='quizzes'){
    const q=S.v==='quizzes';
    let g='';
    D.all.forEach((p,k)=>{
      const n=k+1,on=q?!!QUIZ[n]:READY.includes(n),x=(k%5)*344,y=Math.floor(k/5)*69;
      const href=on?(q?QUIZ[n]:'#t'+n+'/0'):null;
      g+=`<${on?'a href="'+href+'"':'div'} class="gi ${on?'on':''}" style="left:${x}px;top:${y}px">${on?`<span class="no">${n}</span>`:LOCK}<div class="tx"><div class="ta">${p[0]}</div><div class="ti">${p[1]}</div></div></${on?'a':'div'}>`;
    });
    h=head(q?'KUIS':'PELAJARAN',q?'Pilih kuis · اختر الاختبار':'Pilih topik · اختر الموضوع')+`<div class="grid">${g}</div>`+nav("go('hub')",null,'Menu Utama','');
  }else{
    const T=D.topics[S.t],L=slides(S.t),s=L[S.i],last=L.length-1;
    const pt=`TOPIK ${S.t}<small>${esc(T.id)}</small>`;
    const rb=s.k==='s'?'Kalimat · الجملة':s.k==='d'?'Contoh dialog · حوار':s.k==='cover'?'Mulai belajar':'Ringkasan · مراجعة';
    h=head(pt,rb);
    let body='',autoList=null;
    if(s.k==='cover'){
      h+=`<div class="cover fade"><div class="meta">Topik ${S.t} · ${T.items.length} kalimat</div><div class="ar" style="font-size:${dn(T.ar)>26?76:92}px">${T.ar}</div><div class="id" style="font-size:${T.id.length>34?38:46}px">${esc(T.id)}</div><button class="go" onclick="go('t${S.t}/1')">Mulai · ابدأ ←</button></div>`;
    }else if(s.k==='s'){
      const it=T.items[s.j],two=it.v.length>1;
      let cols='';autoList=[];
      it.v.forEach((v,q)=>{
        const id='sp'+q,key=it.n+(q?'f':'');
        autoList.push([key,v.ar,id]);
        cols+=`<div class="col ${two?'':'one'}">${v.l?`<span class="lab">${v.l}</span>`:''}<div class="ar" style="font-size:${arSize(v.ar,!two)}px">${v.ar}</div><div class="tr" style="font-size:${trSize(v.tr)}px">${esc(v.tr)}</div>${speaker(id,key,v.ar)}</div>`;
      });
      h+=`<div class="card fade"><div class="numb">${it.n}</div><div class="cols">${cols}</div><div class="mean" style="font-size:${mSize(it.id)}px">${esc(it.id)}</div></div>`;
      window._al=autoList;
    }else if(s.k==='d'){
      const it=T.items[s.j];
      autoList=[[it.n+'a',it.aar,'sa'],[it.n+'b',it.bar,'sb']];
      h+=`<div class="card fade"><div class="numb">${it.n}</div><div class="dlg">
       <div class="bub a"><div class="who">أ</div><div class="txt"><div class="ar" style="font-size:${dSize(it.aar)}px">${it.aar.replace(/^أ:\s*/,'')}</div><div class="idn">${esc(it.aid)}</div></div>${speaker('sa',it.n+'a',it.aar.replace(/^أ:\s*/,''))}</div>
       <div class="bub b"><div class="who">ب</div><div class="txt"><div class="ar" style="font-size:${dSize(it.bar)}px">${it.bar.replace(/^ب:\s*/,'')}</div><div class="idn">${esc(it.bid)}</div></div>${speaker('sb',it.n+'b',it.bar.replace(/^ب:\s*/,''))}</div></div>
       <button class="pdlg" onclick="seq(window._al)">▶ Putar dialog · شغّل الحوار</button></div>`;
      autoList=[[it.n+'a',it.aar.replace(/^أ:\s*/,''),'sa'],[it.n+'b',it.bar.replace(/^ب:\s*/,''),'sb']];
      window._al=autoList;
    }else{
      let rows='';T.items.forEach((it,j)=>{rows+=`<a href="#t${S.t}/${slides(S.t).findIndex(x=>x.k==='s'&&x.j===j)}" style="text-decoration:none;color:inherit;display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--gold);border-radius:18px;padding:2px 12px"><b style="color:var(--g);width:46px;font-size:20px">${it.n}</b><span class="ar" style="font-size:26px;font-weight:700;flex:1;color:var(--gd);white-space:nowrap;overflow:hidden">${it.v[0].ar}</span></a>`});
      h+=`<div class="card fade" style="overflow:auto;padding:26px 30px"><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px">${rows}</div></div>
      ${QUIZ[S.t]?`<a class="go" style="position:absolute;left:1560px;top:300px;width:320px;text-align:center;font-size:30px;padding:18px 10px;line-height:1.3;text-decoration:none" href="${QUIZ[S.t]}">Kuis topik ${S.t}<br>الاختبار ←</a>`:''}`;
    }
    const pv=S.i>0?`go('t${S.t}/${S.i-1}')`:"go('lessons')";
    const nx=S.i<last?`go('t${S.t}/${S.i+1}')`:`go('lessons')`;
    h+=`<a class="homeb" href="#hub" title="Menu Utama"><svg viewBox="0 0 64 64"><path d="M8 32L32 10l24 22h-7v22H39V40H25v14H15V32z" fill="#f2c651"/></svg>Menu Utama</a>`;
    h+=`<div id="cnt">${S.i+1} / ${L.length}</div><div id="prog"><b style="width:${(S.i/last)*100}%"></b></div>`;
    h+=nav(pv,nx,S.i>0?'Sebelumnya':'Daftar isi',S.i<last?'Selanjutnya':'Selesai');
    if(s.k==='s'||s.k==='d')h+=tools();
    ui.innerHTML=h;
    if((s.k==='s'||s.k==='d')&&auto&&!keep)setTimeout(()=>seq(window._al),450);
    if(!('speechSynthesis' in window))$('#warn').textContent='Browser tidak mendukung suara · المتصفح لا يدعم الصوت';
    return;
  }
  ui.innerHTML=h;
}
addEventListener('keydown',e=>{
  if(S.v!=='t')return;const L=slides(S.t);
  if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' ')go('t'+S.t+'/'+Math.min(S.i+1,L.length-1));
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp')go('t'+S.t+'/'+Math.max(S.i-1,0));
  else if(e.key==='p')seq(window._al||[]);
});
let tx=null;
addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{if(tx===null||S.v!=='t')return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)<90)return;const L=slides(S.t);
  go('t'+S.t+'/'+(dx<0?Math.min(S.i+1,L.length-1):Math.max(S.i-1,0)))},{passive:true});
parse();
</script>
</body>
</html>
