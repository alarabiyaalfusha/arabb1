function stopAudio(){try{if(cur){cur.pause();cur=null}if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}}
function speak(it,rate){return new Promise(res=>{stopAudio();let done=false;const fin=()=>{if(!done){done=true;res()}};
 const tts=()=>{try{if(!window.speechSynthesis)return fin();const u=new SpeechSynthesisUtterance(it.ar);u.lang='ar-SA';u.rate=(rate||1)*.85;const v=speechSynthesis.getVoices().find(x=>/^ar/i.test(x.lang));if(v)u.voice=v;u.onend=fin;u.onerror=fin;speechSynthesis.speak(u);setTimeout(fin,8000)}catch(e){fin()}};
 if(!CFG.audio)return tts();
 const a=new Audio(CFG.audio+it.n+'.mp3');cur=a;a.playbackRate=rate||1;a.onended=fin;a.onerror=()=>{if(cur===a)tts()};const p=a.play();if(p&&p.catch)p.catch(()=>{if(cur===a)tts()})})}
function popup(t){const d=document.createElement('div');d.className='pop';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),800)}
/* data pools */
function setPool(){pool=topic==='all'?ITEMS:ITEMS.filter(i=>i.t==topic)}
function distinct(n,cond,ex){const out=[],seen=new Set((ex||[]).map(x=>x.id.toLowerCase()));for(const it of shuffle(pool)){if(out.length>=n)break;if(cond&&!cond(it))continue;const k=it.id.toLowerCase(),a=strip(it.ar);if(seen.has(k)||out.some(o=>strip(o.ar)===a)||(ex||[]).some(o=>strip(o.ar)===a))continue;seen.add(k);out.push(it)}return out}
const wc=it=>it.ar.trim().split(/\s+/).length;
/* ---------- HOME ---------- */
const GAMES=[
 {k:'catch',em:'⚡',n:'Tangkap Arti',a:'صَائِدُ الْمَعَانِي',d:'Tangkap kalimat Arab yang cocok sebelum jatuh!'},
 {k:'build',em:'🧩',n:'Susun Kalimat',a:'مُهَنْدِسُ الْجُمَلِ',d:'Susun kata-kata menjadi kalimat yang benar.'},
 {k:'ear',em:'🎧',n:'Telinga Emas',a:'الْأُذُنُ الذَّهَبِيَّةُ',d:'Dengarkan, lalu pilih yang kamu dengar.'},
 {k:'mem',em:'🧠',n:'Kartu Memori',a:'بِطَاقَاتُ الذَّاكِرَةِ',d:'Cocokkan kalimat Arab dengan artinya.'}];
function head(){return `<header><a class="brand" href="${CFG.home||'#'}"><img src="${CFG.logo}" alt="Logo Al-Fusha Academy"><span><b>العربية الفصحى</b><small>AL-FUSHA ACADEMY</small></span></a><span class="badge">${CFG.level}</span></header>`}
function home(){clearAll();
 let h=head()+`<h1 class="fadein">Permainan <span>Bahasa Arab</span></h1><p class="sub">${CFG.free?`Main gratis dengan ${ITEMS.length} kalimat Level ${CFG.level}`:`Level ${CFG.level} · ${ITEMS.length} kalimat`}</p>`;
 if(!CFG.free&&TOPICS.length>1){h+=`<div class="sel"><label for="tp">Topik:</label><select id="tp"><option value="all">Semua topik</option>${TOPICS.map((t,i)=>`<option value="${i+1}" ${topic==i+1?'selected':''}>${i+1}. ${esc(t)}</option>`).join('')}</select></div>`}
 h+=`<div class="games">${GAMES.map(g=>`<button class="gcard fadein" data-g="${g.k}"><div class="em">${g.em}</div><h3>${g.n}</h3><div class="an ar">${g.a}</div><p>${g.d}</p><span class="best">🏆 ${best(g.k)}</span></button>`).join('')}</div>`;
 if(CFG.free)h+=`<div class="free">🎁 Ini versi gratis (${ITEMS.length} kalimat). Versi lengkap ada di setiap level, dengan <b>3000 kalimat</b>, audio, dan kuis. <div class="row" style="margin-top:10px"><a class="btn gold sm" href="${CFG.buy.paket}">Paket Lengkap A1–B2</a><a class="btn sm" href="${CFG.buy.level}">Level ${CFG.level}</a></div></div>`;
 else if(CFG.home)h+=`<div class="row" style="margin-top:16px"><a class="btn ghost sm" href="${CFG.home}">← Menu Utama</a></div>`;
 h+=`<p class="note">🔊 Nyalakan suara untuk pengalaman terbaik.</p>`;
 app.innerHTML=h;
 const tp=$('#tp');if(tp)tp.onchange=()=>{topic=tp.value;setPool();if(pool.length<6){alert('Topik ini terlalu sedikit kalimatnya, pilih topik lain.');topic='all';setPool();home()}};
 app.querySelectorAll('.gcard').forEach(b=>b.onclick=()=>{sfx.tap();({catch:gCatch,build:gBuild,ear:gEar,mem:gMem})[b.dataset.g]()});
}
function hud(title,stats){return `<div class="hud"><button class="back" aria-label="Kembali" onclick="home()">←</button><div class="ttl">${title}</div><div class="stat">${stats}</div></div>`}
/* ---------- END ---------- */
function end(g,score,max,detail){clearAll();sfx.win();
 const pct=score/Math.max(1,max),st=pct>=.8?3:pct>=.5?2:pct>0?1:0,nb=setBest(g,score),G=GAMES.find(x=>x.k===g);
 let h=head()+`<div class="panel end fadein"><div style="font-size:2.4rem">${G.em}</div><h1>${st>=3?'Mumtaz! ممتاز':st==2?'Bagus sekali!':'Ayo coba lagi!'}</h1><div class="stars">${'⭐'.repeat(st)}${'☆'.repeat(3-st)}</div><div class="score">${score}</div><div class="hs">${nb?'🎉 Rekor baru!':'Rekor terbaik: '+best(g)}${detail?' · '+detail:''}</div>
 <div class="row"><button class="btn" id="again">↻ Main lagi</button><button class="btn ghost" onclick="home()">Pilih game</button><button class="btn ghost" id="share">📤 Tantang teman</button></div></div>`;
 if(CFG.free)h+=`<div class="cta fadein"><b>Kamu baru mencoba ${ITEMS.length} dari 3000 kalimat!</b><p>Buka semua level lengkap dengan audio, dialog, kuis, dan permainan ini untuk setiap level.</p><div class="ctas"><a class="btn gold" href="${CFG.buy.paket}">Paket Lengkap · Rp99.000</a><a class="btn ghost" href="${CFG.buy.level}">Level ${CFG.level} · Rp39.000</a></div></div>`;
 app.innerHTML=h;
 $('#again').onclick=()=>({catch:gCatch,build:gBuild,ear:gEar,mem:gMem})[g]();
 $('#share').onclick=async()=>{const url=CFG.share||location.href.split('#')[0],txt=`Aku dapat ${score} poin di game "${G.n}" bahasa Arab Al-Fusha! ${'⭐'.repeat(st)} Bisa kalahkan skorku?`;
  try{if(navigator.share){await navigator.share({title:'Game Bahasa Arab',text:txt,url});return}}catch(e){return}
  window.open('https://wa.me/?text='+encodeURIComponent(txt+' '+url),'_blank')};
}
/* ---------- GAME 1: CATCH ---------- */
function gCatch(){clearAll();
 const P=pool.filter(i=>wc(i)<=4&&i.id.length<=48),src=P.length>=8?P:pool;
 let lives=3,score=0,round=0,combo=0,speed=48,ROUNDS=15,target,drops=[],last=0,busy=false;
 app.innerHTML=hud('⚡ Tangkap Arti',`<span class="lives" id="lv">❤️❤️❤️</span><span id="sc">0</span>`)+`<div class="bar"><b id="pb"></b></div><div class="panel prompt" id="pr"></div><div class="arena" id="ar"><div class="ground"></div></div><div class="fb" id="fb"></div>`;
 const ar=$('#ar');
 function next(){if(lives<=0||round>=ROUNDS)return end('catch',score,ROUNDS*15,`${round} ronde`);
  round++;busy=false;$('#pb').style.width=(round-1)/ROUNDS*100+'%';
  const pick=distinct(3,null,[]).filter(Boolean);const set=pick.length>=3?pick:distinct(3);target=set[0];
  $('#pr').innerHTML=`<small>Tangkap kalimat Arab yang artinya:</small>${esc(target.id)}`;
  ar.querySelectorAll('.drop').forEach(d=>d.remove());drops=[];
  const lanes=shuffle([0,1,2]);
  shuffle(set).forEach((it,i)=>{const d=document.createElement('button');d.className='drop';d.textContent=it.ar;d.style.left=(2+lanes[i]*33)+'%';const y=-90-i*45;d.style.top=y+'px';ar.appendChild(d);const o={el:d,it,y};drops.push(o);d.onclick=()=>hit(o)});
  last=performance.now();raf=requestAnimationFrame(loop)}
 function loop(t){const dt=Math.min(50,t-last)/1000;last=t;const H=ar.clientHeight;
  for(const o of drops){o.y+=speed*dt;o.el.style.top=o.y+'px'}
  const tg=drops.find(o=>o.it===target);
  if(!busy&&tg&&tg.y>H-tg.el.offsetHeight-8){busy=true;miss('Terlewat! ⏬')}
  if(!busy)raf=requestAnimationFrame(loop)}
 function miss(msg){sfx.no();lives--;combo=0;$('#lv').textContent='❤️'.repeat(lives)+'🤍'.repeat(3-lives);
  const tg=drops.find(o=>o.it===target);if(tg)tg.el.classList.add('ok');$('#fb').innerHTML=`<span style="color:var(--no)">${msg}</span> <span class="ar">${esc(target.ar)}</span>`;
  speak(target);timers.push(setTimeout(next,1600))}
 function hit(o){if(busy)return;busy=true;cancelAnimationFrame(raf);
  if(o.it===target){combo++;const p=10+Math.min(combo-1,5)*1;score+=p;sfx.ok();o.el.classList.add('ok');popup('+'+p+(combo>1?' 🔥x'+combo:''));$('#sc').textContent=score;$('#fb').innerHTML='<span style="color:var(--ok)">Benar! أحسنت</span>';speed+=7;speak(target);timers.push(setTimeout(next,1100))}
  else{o.el.classList.add('no');miss('Belum tepat!')}}
 next()}
/* ---------- GAME 2: BUILD ---------- */
function gBuild(){clearAll();
 const P=pool.filter(i=>{const w=i.ar.trim().split(/\s+/);return w.length>=3&&w.length<=7&&new Set(w).size===w.length});const src=shuffle(P.length?P:pool).slice(0,8);
 let r=0,score=0,TL=35;
 function next(){if(r>=src.length)return end('build',score,src.length*45,`${src.length} kalimat`);
  const it=src[r];r++;const words=it.ar.trim().split(/\s+/);let bank=shuffle(words.map((w,k)=>({w,k}))),chosen=[],left=TL,done=false,hints=0;
  if(bank.every((b,i)=>b.k===i)&&bank.length>1)bank.reverse();
  app.innerHTML=hud('🧩 Susun Kalimat',`<span>${r}/${src.length}</span><span id="sc">${score}</span>`)+`<div class="bar"><b style="width:${(r-1)/src.length*100}%"></b></div>
  <div class="panel"><div class="prompt"><small>Susun kalimat yang artinya:</small>${esc(it.id)}</div><div class="timer"><b id="tm"></b></div>
  <div class="ans" id="ans"></div><div class="bank" id="bank"></div><div class="row" style="margin-top:6px"><button class="btn ghost sm" id="hint">💡 Petunjuk</button><button class="btn ghost sm" id="snd">🔊 Dengar</button><button class="btn ghost sm" id="clr">↺ Ulang</button></div><div class="fb" id="fb"></div></div>`;
  function draw(){const a=$('#ans'),b=$('#bank');a.innerHTML='';b.innerHTML='';
   chosen.forEach((t,i)=>{const e=document.createElement('button');e.className='tok';e.textContent=t.w;e.onclick=()=>{if(done)return;sfx.tap();chosen.splice(i,1);bank.push(t);draw()};a.appendChild(e)});
   bank.forEach((t,i)=>{const e=document.createElement('button');e.className='tok';e.textContent=t.w;e.onclick=()=>{if(done)return;sfx.tap();bank.splice(i,1);chosen.push(t);draw();check()};b.appendChild(e)})}
  function check(){if(chosen.length<words.length)return;const ok=chosen.map(t=>t.w).join(' ')===words.join(' ');
   if(ok){done=true;clearInterval(iv);const p=Math.max(10,20+Math.round(left)-hints*8);score+=p;sfx.ok();popup('+'+p);$('#sc').textContent=score;$('#ans').classList.add('ok');$('#fb').innerHTML=`<span style="color:var(--ok)">Benar! أحسنت</span> · <i>${esc(it.tr)}</i>`;speak(it).then(()=>timers.push(setTimeout(next,700)))}
   else{sfx.no();$('#ans').classList.remove('no');void $('#ans').offsetWidth;$('#ans').classList.add('no');$('#fb').innerHTML='<span style="color:var(--no)">Urutannya belum tepat, coba lagi!</span>'}}
  $('#clr').onclick=()=>{if(done)return;bank=bank.concat(chosen);chosen=[];draw()};
  $('#snd').onclick=()=>speak(it,.8);
  $('#hint').onclick=()=>{if(done)return;hints++;bank=bank.concat(chosen);chosen=[];const k=Math.min(hints,words.length-1);for(let i=0;i<k;i++){const j=bank.findIndex(t=>t.k===i);chosen.push(bank.splice(j,1)[0])}draw();check()};
  draw();
  const iv=setInterval(()=>{left-=.1;$('#tm').style.width=Math.max(0,left/TL*100)+'%';if(left<=0&&!done){done=true;clearInterval(iv);sfx.no();chosen=words.map((w,k)=>({w,k}));bank=[];draw();$('#ans').classList.add('no');$('#fb').innerHTML='<span style="color:var(--no)">Waktu habis!</span>';speak(it).then(()=>timers.push(setTimeout(next,900)))}},100);timers.push(iv)}
 next()}
/* ---------- GAME 3: EAR ---------- */
function gEar(){clearAll();
 const src=shuffle(pool).slice(0,10);let r=0,score=0;
 function next(){if(r>=src.length)return end('ear',score,src.length*10,`${score/10|0}/${src.length} benar`);
  const it=src[r];r++;const mode=r%3===0?'lat':'ar';const opts=shuffle([it].concat(distinct(3,null,[it])));let done=false;
  app.innerHTML=hud('🎧 Telinga Emas',`<span>${r}/${src.length}</span><span id="sc">${score}</span>`)+`<div class="bar"><b style="width:${(r-1)/src.length*100}%"></b></div>
  <div class="panel"><div class="prompt"><small>${mode==='ar'?'Dengarkan, lalu pilih kalimat yang kamu dengar':'Dengarkan, lalu pilih artinya'}</small></div><button class="big" id="pl" aria-label="Putar suara">🔊</button>
  <div class="row"><button class="btn ghost sm" id="slow">🐢 Pelan</button></div>
  <div class="opts">${opts.map((o,i)=>`<button class="opt ${mode==='lat'?'lat':''}" data-i="${i}">${esc(mode==='ar'?o.ar:o.id)}</button>`).join('')}</div><div class="fb" id="fb"></div></div>`;
  const pl=$('#pl'),play=rt=>{pl.classList.add('play');speak(it,rt).then(()=>pl.classList.remove('play'))};
  pl.onclick=()=>play(1);$('#slow').onclick=()=>play(.7);timers.push(setTimeout(()=>play(1),350));
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(done)return;done=true;const o=opts[+b.dataset.i],ok=o===it;
   app.querySelectorAll('.opt').forEach(x=>{if(opts[+x.dataset.i]===it)x.classList.add('ok')});
   if(ok){score+=10;sfx.ok();popup('+10');$('#sc').textContent=score}else{b.classList.add('no');sfx.no()}
   $('#fb').innerHTML=`<span class="ar" style="font-size:1.3rem">${esc(it.ar)}</span><br><span style="color:var(--mut);font-weight:600">${esc(it.id)}</span>`;
   timers.push(setTimeout(next,ok?1500:2400))})}
 next()}
/* ---------- GAME 4: MEMORY ---------- */
function gMem(){clearAll();
 const P=pool.filter(i=>i.ar.length<=34&&i.id.length<=40);const pairs=distinct(6,P.length>=6?(i=>i.ar.length<=34&&i.id.length<=40):null);
 let cards=shuffle(pairs.flatMap((it,k)=>[{k,ar:true,it},{k,ar:false,it}])),open=[],moves=0,found=0,t0=Date.now(),lock=false;
 app.innerHTML=hud('🧠 Kartu Memori',`<span id="mv">0 langkah</span><span id="tm">0s</span>`)+`<div class="bar"><b id="pb"></b></div><p class="sub" style="margin:0">Cocokkan kalimat Arab dengan artinya.</p><div class="mem" id="mem">${cards.map((c,i)=>`<button class="mc" data-i="${i}" aria-label="Kartu"><div class="in"><div class="fa">؟</div><div class="ba ${c.ar?'ar':''}">${esc(c.ar?c.it.ar:c.it.id)}</div></div></button>`).join('')}</div><div class="fb" id="fb"></div>`;
 const iv=setInterval(()=>{$('#tm').textContent=Math.round((Date.now()-t0)/1000)+'s'},500);timers.push(iv);
 app.querySelectorAll('.mc').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,c=cards[i];if(lock||b.classList.contains('up')||b.classList.contains('done'))return;sfx.tap();b.classList.add('up');open.push([b,c]);if(c.ar)speak(c.it);
  if(open.length===2){moves++;$('#mv').textContent=moves+' langkah';const[[b1,c1],[b2,c2]]=open;open=[];
   if(c1.k===c2.k&&c1.ar!==c2.ar){b1.classList.add('done');b2.classList.add('done');found++;sfx.ok();$('#pb').style.width=found/pairs.length*100+'%';if(!c2.ar&&!c1.ar){}else speak(c1.it);
    if(found===pairs.length){const sec=Math.round((Date.now()-t0)/1000),sc=Math.max(10,120-(moves-6)*6-Math.max(0,sec-40));timers.push(setTimeout(()=>end('mem',sc,120,`${moves} langkah · ${sec}s`),900))}}
   else{lock=true;sfx.no();timers.push(setTimeout(()=>{b1.classList.remove('up');b2.classList.remove('up');lock=false},900))}}})}
setPool();home();
</script>
</body>
