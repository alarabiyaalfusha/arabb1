<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Permainan Bahasa Arab · Level B1</title>
<meta name="description" content="Permainan bahasa Arab interaktif: tangkap arti, susun kalimat, tebak suara, dan cocokkan kartu. Al-Fusha Academy.">
<meta property="og:title" content="Permainan Bahasa Arab · Level B1">
<meta property="og:description" content="Main game bahasa Arab gratis. Bisa kalahkan skorku?">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--c:#70452E;--cd:#352116;--gold:#D6A63C;--champ:#F4D98B;--ivory:#FFF9EB;--ink:#352116;--mut:#6b5a4c;--line:#eadfcb;--ok:#2e9e6a;--no:#d04545}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Poppins,system-ui,sans-serif;background:var(--ivory);color:var(--ink);overflow-x:hidden}
.ar{font-family:Amiri,'Noto Naskh Arabic',serif;direction:rtl}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.bgc{position:fixed;border-radius:50%;pointer-events:none;z-index:0}
#app{position:relative;z-index:1;max-width:760px;margin:0 auto;min-height:100%;padding:14px 16px 40px;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.brand img{width:44px;height:44px;border-radius:50%;box-shadow:0 0 0 2px var(--gold)}
.brand b{display:block;font-family:Amiri,serif;font-size:1.15rem;line-height:1.1}
.brand small{display:block;font-size:.62rem;letter-spacing:.12em;font-weight:600;color:var(--mut)}
.badge{width:52px;height:58px;border-radius:12px 12px 26px 26px;background:var(--c);border:3px solid var(--gold);color:var(--champ);font-weight:800;font-size:1.2rem;display:flex;align-items:center;justify-content:center;flex:none}
h1{font-size:clamp(1.5rem,6vw,2.2rem);line-height:1.15;font-weight:800;text-align:center}
h1 span{color:var(--c)}
.sub{text-align:center;color:var(--mut);margin:6px 0 18px;font-size:.95rem}
.games{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gcard{position:relative;background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px 14px 14px;text-align:center;box-shadow:0 8px 20px rgba(53,33,22,.06);transition:transform .15s}
.gcard:hover{transform:translateY(-3px)}
.gcard .em{font-size:2.4rem;line-height:1.1}
.gcard h3{font-size:1rem;margin-top:6px}
.gcard .an{font-family:Amiri,serif;color:var(--c);font-size:1.15rem;font-weight:700}
.gcard p{font-size:.76rem;color:var(--mut);margin-top:4px;line-height:1.35}
.gcard .best{display:inline-block;margin-top:8px;font-size:.72rem;font-weight:700;background:var(--ivory);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.sel{display:flex;gap:8px;align-items:center;justify-content:center;margin:0 0 16px;font-size:.85rem;font-weight:600}
.sel select{font:inherit;border:2px solid var(--line);border-radius:12px;padding:6px 10px;background:#fff;max-width:70vw}
.note{font-size:.78rem;color:var(--mut);text-align:center;margin-top:14px}
.free{margin-top:16px;background:#fff;border:2px dashed var(--gold);border-radius:18px;padding:14px;text-align:center;font-size:.88rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--c);color:#fff;font-weight:700;border-radius:999px;padding:12px 22px;text-decoration:none;box-shadow:0 6px 16px rgba(53,33,22,.18);font-size:.95rem}
.btn.gold{background:var(--gold);color:#2a1a0f}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.sm{padding:8px 14px;font-size:.82rem}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
/* game hud */
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.hud .back{width:42px;height:42px;border-radius:50%;background:#fff;border:2px solid var(--line);font-size:1.2rem;flex:none}
.hud .ttl{font-weight:800;font-size:1rem;flex:1;text-align:center}
.stat{display:flex;gap:6px}
.stat span{background:#fff;border:2px solid var(--line);border-radius:12px;padding:4px 10px;font-weight:700;font-size:.85rem;white-space:nowrap}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-bottom:14px}
.bar b{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.panel{background:#fff;border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 10px 26px rgba(53,33,22,.07)}
.prompt{text-align:center;font-weight:700;font-size:1.05rem}
.prompt small{display:block;font-weight:500;color:var(--mut);font-size:.8rem;margin-bottom:4px}
/* catcher */
.arena{position:relative;height:min(58vh,520px);border-radius:24px;background:linear-gradient(#fff,var(--ivory));border:1px solid var(--line);overflow:hidden;margin-top:12px;touch-action:manipulation}
.drop{position:absolute;width:31%;min-height:76px;padding:8px 6px;border-radius:18px;background:#fff;border:3px solid var(--c);display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:0 8px 16px rgba(53,33,22,.12);font-family:Amiri,serif;direction:rtl;font-weight:700;font-size:clamp(1.05rem,4.6vw,1.5rem);line-height:1.35;color:var(--cd)}
.drop.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.drop.no{background:var(--no);border-color:var(--no);color:#fff;animation:shake .3s}
.ground{position:absolute;left:0;right:0;bottom:0;height:8px;background:var(--c);opacity:.25}
.lives{letter-spacing:2px}
/* builder */
.ans,.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:rtl;min-height:64px;padding:10px;border-radius:18px}
.ans{background:var(--ivory);border:2px dashed var(--c);margin:14px 0 10px}
.tok{font-family:Amiri,serif;font-weight:700;font-size:1.45rem;background:#fff;border:2px solid var(--c);border-radius:14px;padding:4px 14px;color:var(--cd);box-shadow:0 3px 0 rgba(53,33,22,.15)}
.ans .tok{background:var(--champ);border-color:var(--gold)}
.ans.ok{border-color:var(--ok);background:#e6f5ee}.ans.no{border-color:var(--no);background:#fbe9e9;animation:shake .3s}
.timer{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:10px}
.timer b{display:block;height:100%;background:var(--c);width:100%}
/* ear */
.big{width:96px;height:96px;border-radius:50%;background:var(--c);color:#fff;font-size:2.4rem;display:flex;align-items:center;justify-content:center;margin:6px auto 4px;box-shadow:0 0 0 8px rgba(214,166,60,.3)}
.big.play{animation:pulse .8s infinite}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-family:Amiri,serif;direction:rtl;font-weight:700;font-size:1.35rem;line-height:1.4;color:var(--cd);text-align:center}
.opt.lat{font-family:Poppins,sans-serif;direction:ltr;font-size:1rem;font-weight:600}
.opt.ok{background:#e6f5ee;border-color:var(--ok)}.opt.no{background:#fbe9e9;border-color:var(--no)}
/* memory */
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.mc{position:relative;height:clamp(92px,22vw,130px);perspective:800px}
.mc .in{position:absolute;inset:0;transition:transform .4s;transform-style:preserve-3d}
.mc.up .in,.mc.done .in{transform:rotateY(180deg)}
.mc .fa,.mc .ba{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px}
.mc .fa{background:var(--c);border:3px solid var(--gold);color:var(--champ);font-size:1.8rem;font-weight:800}
.mc .ba{background:#fff;border:3px solid var(--c);transform:rotateY(180deg);font-size:.8rem;font-weight:600;line-height:1.25}
.mc .ba.ar{font-size:clamp(1rem,4vw,1.35rem);font-weight:700;line-height:1.35}
.mc.done .ba{background:#e6f5ee;border-color:var(--ok)}
/* feedback */
.fb{text-align:center;font-weight:700;min-height:1.6em;margin-top:10px}
.pop{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-size:2rem;font-weight:800;color:var(--gold);pointer-events:none;animation:popup .8s ease-out both;z-index:50;text-shadow:0 2px 0 #fff}
/* end */
.end{text-align:center}
.end .stars{font-size:2.8rem;letter-spacing:6px;margin:6px 0}
.end .score{font-size:3rem;font-weight:800;color:var(--c);line-height:1}
.end .hs{color:var(--mut);font-size:.85rem;margin:4px 0 16px}
.cta{margin-top:18px;background:linear-gradient(135deg,var(--c),var(--cd));color:#fff;border-radius:22px;padding:18px;text-align:center}
.cta b{font-size:1.1rem}.cta p{font-size:.85rem;opacity:.9;margin:6px 0 12px}
.ctas{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pulse{50%{transform:scale(1.08)}}
@keyframes popup{from{opacity:1;transform:translate(-50%,-30%) scale(.6)}to{opacity:0;transform:translate(-50%,-120%) scale(1.2)}}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}}
.fadein{animation:fadein .35s ease both}
@media(min-width:620px){.games{grid-template-columns:repeat(4,1fr)}.mem{grid-template-columns:repeat(4,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const ITEMS=[{"n": "1501", "ar": "فِي رَأْيِي، التَّعَلُّمُ مِنَ الْأَخْطَاءِ أَهَمُّ مِنْ تَجَنُّبِهَا.", "tr": "Fī raʾyī, at-taʿallumu mina al-akhṭāʾi ahammu min tajannubihā.", "id": "Menurut saya, belajar dari kesalahan lebih penting daripada menghindarinya.", "t": 1}, {"n": "1502", "ar": "أَعْتَقِدُ أَنَّ السَّفَرَ يُوَسِّعُ الْآفَاقَ.", "tr": "Aʿtaqidu anna as-safara yuwassiʿu al-āfāqa.", "id": "Saya yakin bepergian memperluas wawasan.", "t": 1}, {"n": "1503", "ar": "لَا أَرَى مُبَرِّرًا لِلتَّأْخِيرِ فِي مِثْلِ هَذِهِ الْمَوَاعِيدِ.", "tr": "Lā arā mubarriran lil-taʾkhīri fī mithli hādhihi al-mawāʿīdi.", "id": "Saya tidak melihat alasan untuk terlambat pada janji seperti ini.", "t": 1}, {"n": "1504", "ar": "مِنْ وِجْهَةِ نَظَرِي، الْحَلُّ الْأَوَّلُ أَكْثَرُ وَاقِعِيَّةً.", "tr": "Min wijhati naẓarī, al-ḥallu al-awwalu aktharu wāqiʿiyyatan.", "id": "Dari sudut pandang saya, solusi pertama lebih realistis.", "t": 1}, {"n": "1505", "ar": "يُمْكِنُنِي أَنْ أَتَفَهَّمَ رَأْيَكَ، لَكِنَّنِي لَا أُوَافِقُكَ.", "tr": "Yumkinunī an atafahhama raʾyaka, lakinnanī lā uwāfiquka.", "id": "Saya bisa memahami pendapatmu, tapi saya tidak setuju.", "t": 1}, {"n": "1506", "ar": "أَرَى أَنَّ الْمُشْكِلَةَ لَيْسَتْ فِي الْمَالِ بَلْ فِي التَّنْظِيمِ.", "tr": "Arā anna al-mushkilata laysat fī al-māli bal fī at-tanẓīmi.", "id": "Saya pikir masalahnya bukan di uang melainkan di pengaturan.", "t": 1}, {"n": "1507", "ar": "مِنَ الْوَاضِحِ أَنَّ الْوَقْتَ لَا يَكْفِي.", "tr": "Mina al-wāḍiḥi anna al-waqta lā yakfī.", "id": "Jelas bahwa waktunya tidak cukup.", "t": 1}, {"n": "1508", "ar": "أَنَا مَعَ هَذِهِ الْفِكْرَةِ بِشَرْطٍ وَاحِدٍ.", "tr": "Anā maʿa hādhihi al-fikrati bi-sharṭin wāḥidin.", "id": "Saya mendukung ide ini dengan satu syarat.", "t": 1}, {"n": "1509", "ar": "لَيْسَ مِنَ الْعَدْلِ أَنْ نَحْكُمَ عَلَيْهِ قَبْلَ أَنْ نَسْمَعَهُ.", "tr": "Laysa mina al-ʿadli an naḥkuma ʿalayhi qabla an nasmaʿahu.", "id": "Tidak adil menghakiminya sebelum kita mendengarnya.", "t": 1}, {"n": "1510", "ar": "هَذِهِ النُّقْطَةُ تَحْتَاجُ إِلَى مَزِيدٍ مِنَ النِّقَاشِ.", "tr": "Hādhihi an-nuqṭatu taḥtāju ilā mazīdin mina an-niqāshi.", "id": "Poin ini perlu dibahas lebih lanjut.", "t": 1}, {"n": "1511", "ar": "أُفَضِّلُ أَنْ أَتَّخِذَ قَرَارِي بَعْدَ التَّفْكِيرِ الْجَيِّدِ.", "tr": "Ufaḍḍilu an attakhidha qarārī baʿda at-tafkīri al-jayyidi.", "id": "Saya lebih suka mengambil keputusan setelah berpikir baik-baik.", "t": 1}, {"n": "1512", "ar": "مَا رَأْيُكَ لَوْ أَجَّلْنَا الرِّحْلَةَ أُسْبُوعًا؟", "tr": "Mā raʾyuka law ajjalnā ar-riḥlata usbūʿan?", "id": "Bagaimana pendapatmu jika kita menunda perjalanan seminggu?", "t": 1}, {"n": "1513", "ar": "أَنَا لَسْتُ مُتَأَكِّدًا مِنْ صِحَّةِ هَذِهِ الْمَعْلُومَةِ.", "tr": "Anā lastu mutaʾakkidan min ṣiḥḥati hādhihi al-maʿlūmati.", "id": "Saya tidak yakin akan kebenaran informasi ini.", "t": 1}, {"n": "1514", "ar": "رُبَّمَا كُنْتَ مُحِقًّا فِي ذَلِكَ.", "tr": "Rubbamā kunta muḥiqqan fī dhālika.", "id": "Mungkin kamu benar soal itu.", "t": 1}, {"n": "1515", "ar": "هَذَا لَا يَعْنِي أَنَّهُ خَطَأٌ بِالضَّرُورَةِ.", "tr": "Hādhā lā yaʿnī annahu khaṭaʾun bi-ḍ-ḍarūrati.", "id": "Itu belum tentu berarti salah.", "t": 1}, {"n": "1516", "ar": "الْأَمْرُ يَعْتَمِدُ عَلَى الظُّرُوفِ.", "tr": "Al-amru yaʿtamidu ʿalā aẓ-ẓurūfi.", "id": "Itu tergantung keadaan.", "t": 1}, {"n": "1517", "ar": "أَعْتَقِدُ أَنَّ الْجَمِيعَ يَسْتَحِقُّ فُرْصَةً ثَانِيَةً.", "tr": "Aʿtaqidu anna al-jamīʿa yastaḥiqqu furṣatan thāniyatan.", "id": "Saya yakin semua orang berhak mendapat kesempatan kedua.", "t": 1}, {"n": "1518", "ar": "مِنَ الصَّعْبِ أَنْ أَحْكُمَ قَبْلَ أَنْ أُجَرِّبَ بِنَفْسِي.", "tr": "Mina aṣ-ṣaʿbi an aḥkuma qabla an ujarriba bi-nafsī.", "id": "Sulit bagi saya menilai sebelum mencoba sendiri.", "t": 1}, {"n": "1519", "ar": "صَحِيحٌ أَنَّهُ غَالٍ، لَكِنَّهُ يَسْتَحِقُّ ذَلِكَ.", "tr": "Ṣaḥīḥun annahu ghālin, lakinnahu yastaḥiqqu dhālika.", "id": "Memang mahal, tapi pantas dengan harganya.", "t": 1}, {"n": "1520", "ar": "لَا أَظُنُّ أَنَّ هَذَا هُوَ الْوَقْتُ الْمُنَاسِبُ.", "tr": "Lā aẓunnu anna hādhā huwa al-waqtu al-munāsibu.", "id": "Saya kira ini bukan waktu yang tepat.", "t": 1}, {"n": "1521", "ar": "أَتَّفِقُ مَعَكَ فِي الْجُزْءِ الْأَوَّلِ فَقَطْ.", "tr": "Attafiqu maʿaka fī al-juzʾi al-awwali faqaṭ.", "id": "Saya sependapat denganmu hanya pada bagian pertama.", "t": 1}, {"n": "1522", "ar": "فِي النِّهَايَةِ، الْقَرَارُ قَرَارُكَ.", "tr": "Fī an-nihāyati, al-qarāru qarāruka.", "id": "Pada akhirnya, keputusan ada di tanganmu.", "t": 1}, {"n": "1523", "ar": "تَأَخَّرْتُ لِأَنَّ الطَّرِيقَ كَانَ مُغْلَقًا بِسَبَبِ حَادِثٍ.", "tr": "Taʾakhkhartu li-anna aṭ-ṭarīqa kāna mughlaqan bi-sababi ḥādithin.", "id": "Saya terlambat karena jalan ditutup akibat kecelakaan.", "t": 2}, {"n": "1524", "ar": "نَتِيجَةً لِذَلِكَ، أُلْغِيَتِ الرِّحْلَةُ.", "tr": "Natījatan li-dhālika, ulghiyati ar-riḥlatu.", "id": "Akibatnya, perjalanan dibatalkan.", "t": 2}, {"n": "1525", "ar": "لِهَذَا السَّبَبِ قَرَّرْتُ أَنْ أَبْقَى.", "tr": "Li-hādhā as-sababi qarrartu an abqā.", "id": "Karena alasan itu saya memutuskan untuk tinggal.", "t": 2}, {"n": "1526", "ar": "كَيْ أَنْجَحَ يَجِبُ أَنْ أَعْمَلَ بِجِدٍّ.", "tr": "Kay anjaḥa yajibu an aʿmala bi-jiddin.", "id": "Agar berhasil, saya harus bekerja keras.", "t": 2}, {"n": "1527", "ar": "دَرَسْتُ كَثِيرًا حَتَّى أَنْجَحَ فِي الِامْتِحَانِ.", "tr": "Darastu kathīran ḥattā anjaḥa fī al-imtiḥāni.", "id": "Saya belajar banyak sampai lulus ujian.", "t": 2}, {"n": "1528", "ar": "بِسَبَبِ الْمَطَرِ لَمْ نَسْتَطِعِ الْخُرُوجَ.", "tr": "Bi-sababi al-maṭari lam nastaṭiʿi al-khurūja.", "id": "Karena hujan, kami tidak bisa keluar.", "t": 2}, {"n": "1529", "ar": "لَوْلَا مُسَاعَدَتُكَ لَمَا أَنْهَيْتُ الْعَمَلَ.", "tr": "Lawlā musāʿadatuka lamā anhaytu al-ʿamala.", "id": "Kalau bukan karena bantuanmu, saya tidak akan menyelesaikan pekerjaan.", "t": 2}, {"n": "1530", "ar": "لَوْ كُنْتُ أَعْرِفُ لَأَخْبَرْتُكَ.", "tr": "Law kuntu aʿrifu la-akhbartuka.", "id": "Andai saya tahu, pasti saya beri tahu.", "t": 2}, {"n": "1531", "ar": "لَوْ دَرَسْتَ أَكْثَرَ لَنَجَحْتَ.", "tr": "Law darasta akthara la-najaḥta.", "id": "Andai kamu belajar lebih banyak, pasti kamu lulus.", "t": 2}, {"n": "1532", "ar": "إِذَا لَمْ تَصِلْ فِي الْوَقْتِ فَسَنَذْهَبُ بِدُونِكَ.", "tr": "Idhā lam taṣil fī al-waqti fa-sa-nadhhabu bi-dūnika.", "id": "Jika kamu tidak tiba tepat waktu, kami berangkat tanpamu.", "t": 2}, {"n": "1533", "ar": "مَعَ أَنَّ الْجَوَّ سَيِّئٌ، سَنَذْهَبُ.", "tr": "Maʿa anna al-jawwa sayyiʾun, sa-nadhhabu.", "id": "Meskipun cuacanya buruk, kami akan pergi.", "t": 2}, {"n": "1534", "ar": "رَغْمَ التَّعَبِ، وَاصَلْتُ الْعَمَلَ.", "tr": "Raghma at-taʿabi, wāṣaltu al-ʿamala.", "id": "Meski capek, saya terus bekerja.", "t": 2}, {"n": "1535", "ar": "بَيْنَمَا كُنْتُ أَنْتَظِرُ، قَرَأْتُ كِتَابًا.", "tr": "Baynamā kuntu antaẓiru, qaraʾtu kitāban.", "id": "Sambil menunggu, saya membaca buku.", "t": 2}, {"n": "1536", "ar": "فَهِمْتُ الْآنَ لِمَاذَا غَضِبَ.", "tr": "Fahimtu al-āna limādhā ghaḍiba.", "id": "Sekarang saya mengerti kenapa dia marah.", "t": 2}, {"n": "1537", "ar": "السَّبَبُ الرَّئِيسِيُّ هُوَ قِلَّةُ الْخِبْرَةِ.", "tr": "As-sababu ar-raʾīsiyyu huwa qillatu al-khibrati.", "id": "Penyebab utamanya adalah kurangnya pengalaman.", "t": 2}, {"n": "1538", "ar": "هَذَا يُفَسِّرُ لِمَاذَا تَأَخَّرَ.", "tr": "Hādhā yufassiru limādhā taʾakhkhara.", "id": "Ini menjelaskan kenapa dia terlambat.", "t": 2}, {"n": "1539", "ar": "نَتَجَ عَنْ ذَلِكَ مُشْكِلَةٌ كَبِيرَةٌ.", "tr": "Nataja ʿan dhālika mushkilatun kabīratun.", "id": "Akibat itu muncul masalah besar.", "t": 2}, {"n": "1540", "ar": "لِذَلِكَ يَجِبُ أَنْ نَكُونَ حَذِرِينَ.", "tr": "Li-dhālika yajibu an nakūna ḥadhirīna.", "id": "Karena itu kita harus berhati-hati.", "t": 2}, {"n": "1541", "ar": "فَقَطْ لِأَنَّهُ صَغِيرٌ لَا يَعْنِي أَنَّهُ لَا يَفْهَمُ.", "tr": "Faqaṭ li-annahu ṣaghīrun lā yaʿnī annahu lā yafhamu.", "id": "Hanya karena dia kecil bukan berarti dia tidak paham.", "t": 2}, {"n": "1542", "ar": "عَلَى الرَّغْمِ مِنْ كُلِّ شَيْءٍ، أَنَا مُتَفَائِلٌ.", "tr": "ʿAlā ar-raghmi min kulli shayʾin, anā mutafāʾilun.", "id": "Terlepas dari segalanya, saya optimis.", "t": 2}, {"n": "1543", "ar": "مَرَرْتُ بِتَجْرِبَةٍ لَنْ أَنْسَاهَا.", "tr": "Marartu bi-tajribatin lan ansāhā.", "id": "Saya mengalami pengalaman yang tidak akan saya lupakan.", "t": 3}, {"n": "1544", "ar": "تَعَلَّمْتُ مِنْ هَذِهِ التَّجْرِبَةِ دَرْسًا مُهِمًّا.", "tr": "Taʿallamtu min hādhihi at-tajribati darsan muhimman.", "id": "Saya belajar pelajaran penting dari pengalaman ini.", "t": 3}, {"n": "1545", "ar": "عِنْدَمَا انْتَقَلْتُ إِلَى بَلَدٍ جَدِيدٍ شَعَرْتُ بِالْغُرْبَةِ.", "tr": "ʿIndamā intaqaltu ilā baladin jadīdin shaʿartu bi-l-ghurbati.", "id": "Ketika pindah ke negara baru, saya merasa asing.", "t": 3}, {"n": "1546", "ar": "اسْتَغْرَقَ الْأَمْرُ مِنِّي شَهْرًا حَتَّى اعْتَدْتُ عَلَيْهِ.", "tr": "Istaghraqa al-amru minnī shahran ḥattā iʿtadtu ʿalayhi.", "id": "Saya butuh sebulan sampai terbiasa.", "t": 3}, {"n": "1547", "ar": "لَقَدْ مَرَّتْ عَلَيَّ لَحَظَاتٌ صَعْبَةٌ لَكِنَّهَا عَلَّمَتْنِي الصَّبْرَ.", "tr": "Laqad marrat ʿalayya laḥaẓātun ṣaʿbatun lakinnahā ʿallamatnī aṣ-ṣabra.", "id": "Saya melewati saat-saat sulit, tapi itu mengajarkan saya kesabaran.", "t": 3}, {"n": "1548", "ar": "كُنْتُ أَظُنُّ أَنَّ الْأَمْرَ سَهْلٌ، لَكِنَّنِي كُنْتُ مُخْطِئًا.", "tr": "Kuntu aẓunnu anna al-amra sahlun, lakinnanī kuntu mukhṭiʾan.", "id": "Saya kira mudah, tapi ternyata saya keliru.", "t": 3}, {"n": "1549", "ar": "لَمْ أَتَوَقَّعْ أَنْ تَكُونَ الرِّحْلَةُ بِهَذَا الْجَمَالِ.", "tr": "Lam atawaqqaʿ an takūna ar-riḥlatu bi-hādhā al-jamāli.", "id": "Saya tidak menyangka perjalanannya seindah ini.", "t": 3}, {"n": "1550", "ar": "أَوَّلُ مَرَّةٍ سَافَرْتُ فِيهَا وَحْدِي كَانَتْ مُخِيفَةً.", "tr": "Awwalu marratin sāfartu fīhā waḥdī kānat mukhīfatan.", "id": "Pertama kali saya bepergian sendirian itu menakutkan.", "t": 3}, {"n": "1551", "ar": "تَعَرَّفْتُ هُنَاكَ عَلَى أَشْخَاصٍ مِنْ ثَقَافَاتٍ مُخْتَلِفَةٍ.", "tr": "Taʿarraftu hunāka ʿalā ashkhāṣin min thaqāfātin mukhtalifatin.", "id": "Di sana saya berkenalan dengan orang dari budaya berbeda.", "t": 3}, {"n": "1552", "ar": "فَاتَتْنِي فُرْصَةٌ جَيِّدَةٌ لِأَنِّي تَرَدَّدْتُ.", "tr": "Fātatnī furṣatun jayyidatun li-annī taraddadtu.", "id": "Saya kehilangan kesempatan bagus karena ragu.", "t": 3}, {"n": "1553", "ar": "نَدِمْتُ عَلَى مَا قُلْتُهُ.", "tr": "Nadimtu ʿalā mā qultuhu.", "id": "Saya menyesali apa yang saya katakan.", "t": 3}, {"n": "1554", "ar": "أَنَا فَخُورٌ بِمَا حَقَّقْتُهُ حَتَّى الْآنَ.", "tr": "Anā fakhūrun bi-mā ḥaqqaqtuhu ḥattā al-āna.", "id": "Saya bangga dengan apa yang telah saya capai sejauh ini.", "t": 3}, {"n": "1555", "ar": "لَوْ عَادَ بِيَ الزَّمَنُ لَفَعَلْتُ الشَّيْءَ نَفْسَهُ.", "tr": "Law ʿāda bī az-zamanu la-faʿaltu ash-shayʾa nafsahu.", "id": "Andai waktu bisa diputar, saya akan melakukan hal yang sama.", "t": 3}, {"n": "1556", "ar": "سَبَقَ أَنْ عَمِلْتُ فِي مَجَالٍ مُشَابِهٍ.", "tr": "Sabaqa an ʿamiltu fī majālin mushābihin.", "id": "Saya pernah bekerja di bidang yang serupa.", "t": 3}, {"n": "1557", "ar": "لَمْ يَسْبِقْ لِي أَنْ جَرَّبْتُ هَذَا الطَّعَامَ.", "tr": "Lam yasbiq lī an jarrabtu hādhā aṭ-ṭaʿāma.", "id": "Saya belum pernah mencoba makanan ini.", "t": 3}, {"n": "1558", "ar": "مُنْذُ أَنْ بَدَأْتُ الدِّرَاسَةَ وَأَنَا أَتَحَسَّنُ.", "tr": "Mundhu an badaʾtu ad-dirāsata wa-anā ataḥassanu.", "id": "Sejak mulai belajar, saya terus membaik.", "t": 3}, {"n": "1559", "ar": "كُنْتُ قَدْ نَسِيتُ الْمَوْضُوعَ تَمَامًا.", "tr": "Kuntu qad nasītu al-mawḍūʿa tamāman.", "id": "Saya sudah benar-benar lupa soal itu.", "t": 3}, {"n": "1560", "ar": "بَعْدَ سَنَوَاتٍ مِنَ الْعَمَلِ قَرَّرْتُ أَنْ أُغَيِّرَ مَسَارِي.", "tr": "Baʿda sanawātin mina al-ʿamali qarrartu an ughayyira masārī.", "id": "Setelah bertahun-tahun bekerja, saya memutuskan mengubah jalur karier.", "t": 3}, {"n": "1561", "ar": "كَانَتْ تِلْكَ أَفْضَلَ قَرَارَاتِي.", "tr": "Kānat tilka afḍala qarārātī.", "id": "Itu keputusan terbaik saya.", "t": 3}, {"n": "1562", "ar": "شَاهَدْتُ شُرُوقَ الشَّمْسِ مِنْ قِمَّةِ الْجَبَلِ.", "tr": "Shāhadtu shurūqa ash-shamsi min qimmati al-jabali.", "id": "Saya menyaksikan matahari terbit dari puncak gunung.", "t": 3}, {"n": "1563", "ar": "تَعَلَّمْتُ أَنْ أَعْتَمِدَ عَلَى نَفْسِي.", "tr": "Taʿallamtu an aʿtamida ʿalā nafsī.", "id": "Saya belajar mengandalkan diri sendiri.", "t": 3}, {"n": "1564", "ar": "مَا زَالَتْ تِلْكَ الذِّكْرَى حَيَّةً فِي ذَاكِرَتِي.", "tr": "Mā zālat tilka adh-dhikrā ḥayyatan fī dhākiratī.", "id": "Kenangan itu masih hidup dalam ingatan saya.", "t": 3}, {"n": "1565", "ar": "هَدَفِي أَنْ أُتْقِنَ الْعَرَبِيَّةَ خِلَالَ سَنَتَيْنِ.", "tr": "Hadafī an utqina al-ʿarabiyyata khilāla sanatayni.", "id": "Tujuan saya menguasai bahasa Arab dalam dua tahun.", "t": 4}, {"n": "1566", "ar": "أُخَطِّطُ لِأَنْ أَدْرُسَ فِي الْخَارِجِ بَعْدَ التَّخَرُّجِ.", "tr": "Ukhaṭṭiṭu li-an adrusa fī al-khāriji baʿda at-takharruji.", "id": "Saya berencana kuliah di luar negeri setelah lulus.", "t": 4}, {"n": "1567", "ar": "سَأَبْذُلُ قُصَارَى جُهْدِي لِتَحْقِيقِ حُلْمِي.", "tr": "Sa-abdhulu quṣārā juhdī li-taḥqīqi ḥulmī.", "id": "Saya akan mengerahkan upaya terbaik untuk mewujudkan mimpi saya.", "t": 4}, {"n": "1568", "ar": "أَحْلُمُ بِأَنْ أَفْتَحَ مَشْرُوعِي الْخَاصَّ.", "tr": "Aḥlumu bi-an aftaḥa mashrūʿī al-khāṣṣa.", "id": "Saya bermimpi membuka usaha sendiri.", "t": 4}, {"n": "1569", "ar": "أُرِيدُ أَنْ أَدَّخِرَ مَبْلَغًا يَكْفِي لِلسَّفَرِ.", "tr": "Urīdu an addakhira mablaghan yakfī lil-safari.", "id": "Saya ingin menabung cukup uang untuk bepergian.", "t": 4}, {"n": "1570", "ar": "إِنْ شَاءَ اللهُ سَأَحُجُّ هَذَا الْعَامَ.", "tr": "In shāʾa Allāhu sa-aḥujju hādhā al-ʿāma.", "id": "Insyaallah saya akan berhaji tahun ini.", "t": 4}, {"n": "1571", "ar": "قَرَّرْتُ أَنْ أُمَارِسَ الرِّيَاضَةَ بِانْتِظَامٍ.", "tr": "Qarrartu an umārisa ar-riyāḍata bi-intiẓāmin.", "id": "Saya memutuskan berolahraga secara teratur.", "t": 4}, {"n": "1572", "ar": "سَأَبْدَأُ مِنَ الْغَدِ لَا مِنَ الْأُسْبُوعِ الْقَادِمِ.", "tr": "Sa-abdaʾu mina al-ghadi lā mina al-usbūʿi al-qādimi.", "id": "Saya akan mulai dari besok, bukan minggu depan.", "t": 4}, {"n": "1573", "ar": "عَلَيَّ أَنْ أُحَدِّدَ أَوْلَوِيَّاتِي.", "tr": "ʿAlayya an uḥaddida awlawiyyātī.", "id": "Saya harus menentukan prioritas.", "t": 4}, {"n": "1574", "ar": "أَضَعُ خُطَّةً لِلْأَشْهُرِ الْقَادِمَةِ.", "tr": "Aḍaʿu khuṭṭatan lil-ashhuri al-qādimati.", "id": "Saya menyusun rencana untuk bulan-bulan mendatang.", "t": 4}, {"n": "1575", "ar": "لَا بُدَّ أَنْ أَتَعَلَّمَ مَهَارَاتٍ جَدِيدَةً.", "tr": "Lā budda an ataʿallama mahārātin jadīdatan.", "id": "Saya harus mempelajari keterampilan baru.", "t": 4}, {"n": "1576", "ar": "أَطْمَحُ إِلَى مَنْصِبٍ أَعْلَى فِي شَرِكَتِي.", "tr": "Aṭmaḥu ilā manṣibin aʿlā fī sharikatī.", "id": "Saya mengincar posisi yang lebih tinggi di perusahaan saya.", "t": 4}, {"n": "1577", "ar": "بَعْدَ خَمْسِ سَنَوَاتٍ أَرَى نَفْسِي مُدِيرًا.", "tr": "Baʿda khamsi sanawātin arā nafsī mudīran.", "id": "Lima tahun lagi saya melihat diri saya sebagai manajer.", "t": 4}, {"n": "1578", "ar": "إِذَا سَارَتِ الْأُمُورُ كَمَا خَطَّطْنَا فَسَنَفْتَتِحُ الْفَرْعَ قَرِيبًا.", "tr": "Idhā sārati al-umūru kamā khaṭṭaṭnā fa-sa-naftatiḥu al-farʿa qarīban.", "id": "Jika semuanya berjalan sesuai rencana, kami akan segera membuka cabang.", "t": 4}, {"n": "1579", "ar": "مِنَ الْمُهِمِّ أَنْ أُحَافِظَ عَلَى حَمَاسِي.", "tr": "Mina al-muhimmi an uḥāfiẓa ʿalā ḥamāsī.", "id": "Penting bagi saya menjaga semangat.", "t": 4}, {"n": "1580", "ar": "لَنْ أَسْتَسْلِمَ مَهْمَا كَانَتِ الصُّعُوبَاتُ.", "tr": "Lan astaslima mahmā kānati aṣ-ṣuʿūbātu.", "id": "Saya tidak akan menyerah, apa pun kesulitannya.", "t": 4}, {"n": "1581", "ar": "أَنَا أَسْعَى إِلَى حَيَاةٍ أَكْثَرَ تَوَازُنًا.", "tr": "Anā asʿā ilā ḥayātin akthara tawāzunan.", "id": "Saya berusaha mencapai hidup yang lebih seimbang.", "t": 4}, {"n": "1582", "ar": "سَأُخَصِّصُ سَاعَةً يَوْمِيًّا لِلْقِرَاءَةِ.", "tr": "Sa-ukhaṣṣiṣu sāʿatan yawmiyyan lil-qirāʾati.", "id": "Saya akan menyediakan satu jam setiap hari untuk membaca.", "t": 4}, {"n": "1583", "ar": "عِنْدَمَا أَتَقَاعَدُ سَأَسْتَقِرُّ فِي قَرْيَةٍ هَادِئَةٍ.", "tr": "ʿIndamā ataqāʿadu sa-astaqirru fī qaryatin hādiʾatin.", "id": "Ketika pensiun saya akan menetap di desa yang tenang.", "t": 4}, {"n": "1584", "ar": "أَتَمَنَّى أَنْ أَرَى الْعَالَمَ كُلَّهُ.", "tr": "Atamannā an arā al-ʿālama kullahu.", "id": "Saya berharap bisa melihat seluruh dunia.", "t": 4}, {"n": "1585", "ar": "تَقَدَّمْتُ لِوَظِيفَةٍ مُنَاسِبَةٍ لِمُؤَهِّلَاتِي.", "tr": "Taqaddamtu li-waẓīfatin munāsibatin li-muʾahhilātī.", "id": "Saya melamar pekerjaan yang sesuai kualifikasi saya.", "t": 5}, {"n": "1586", "ar": "أُرْفِقُ مَعَ هَذَا الْبَرِيدِ سِيرَتِي الذَّاتِيَّةَ.", "tr": "Urfiqu maʿa hādhā al-barīdi sīratī adh-dhātiyyata.", "id": "Saya lampirkan CV saya bersama email ini.", "t": 5}, {"n": "1587", "ar": "دُعِيتُ إِلَى مُقَابَلَةٍ شَخْصِيَّةٍ يَوْمَ الثُّلَاثَاءِ.", "tr": "Duʿītu ilā muqābalatin shakhṣiyyatin yawma ath-thulāthāʾi.", "id": "Saya dipanggil wawancara hari Selasa.", "t": 5}, {"n": "1588", "ar": "سَأَلُونِي عَنْ خِبْرَتِي وَعَنْ أَهْدَافِي.", "tr": "Saʾalūnī ʿan khibratī wa-ʿan ahdāfī.", "id": "Mereka menanyakan pengalaman dan tujuan saya.", "t": 5}, {"n": "1589", "ar": "أُجِيدُ الْعَمَلَ تَحْتَ الضَّغْطِ.", "tr": "Ujīdu al-ʿamala taḥta aḍ-ḍaghṭi.", "id": "Saya mahir bekerja di bawah tekanan.", "t": 5}, {"n": "1590", "ar": "أَتَعَامَلُ مَعَ الْعُمَلَاءِ بِاحْتِرَافٍ.", "tr": "Ataʿāmalu maʿa al-ʿumalāʾi bi-iḥtirāfin.", "id": "Saya melayani pelanggan secara profesional.", "t": 5}, {"n": "1591", "ar": "قَدْ نَحْتَاجُ إِلَى مَزِيدٍ مِنَ الْمَوَارِدِ لِلْمَشْرُوعِ.", "tr": "Qad naḥtāju ilā mazīdin mina al-mawāridi lil-mashrūʿi.", "id": "Kita mungkin butuh lebih banyak sumber daya untuk proyek.", "t": 5}, {"n": "1592", "ar": "لَدَيَّ خِبْرَةٌ فِي إِدَارَةِ الْفَرِيقِ.", "tr": "Ladayya khibratun fī idārati al-farīqi.", "id": "Saya punya pengalaman m  "Ṣarraftu akthara mimmā kuntu anwī.", "id": "Saya mengeluarkan lebih dari yang saya niatkan.", "t": 12}, {"n": "1714", "ar": "مِنَ الذَّكَاءِ أَنْ نَدَّخِرَ جُزْءًا مِنَ الدَّخْلِ.", "tr": "Mina adh-dhakāʾi an naddakhira juzʾan mina ad-dakhli.", "id": "Cerdas jika kita menabung sebagian pendapatan.", "t": 12}, {"n": "1715", "ar": "الْأَسْعَارُ فِي هَذَا الْمَحَلِّ مُبَالَغٌ فِيهَا.", "tr": "Al-asʿāru fī hādhā al-maḥalli mubālaghun fīhā.", "id": "Harga di toko ini berlebihan.", "t": 12}, {"n": "1716", "ar": "هَلْ هُنَاكَ إِمْكَانِيَّةٌ لِلتَّفَاوُضِ عَلَى السِّعْرِ؟", "tr": "Hal hunāka imkāniyyatun lil-tafāwuḍi ʿalā as-siʿri?", "id": "Apakah ada kemungkinan menawar harga?", "t": 12}, {"n": "1717", "ar": "اشْتَرَيْتُهُ لِأَنَّهُ يَدُومُ أَطْوَلَ.", "tr": "Ishtaraytuhu li-annahu yadūmu aṭwala.", "id": "Saya membelinya karena lebih awet.", "t": 12}, {"n": "1718", "ar": "احْتَفِظْ بِالْإِيصَالِ فِي حَالِ أَرَدْتَ الْإِرْجَاعَ.", "tr": "Iḥtafiẓ bi-l-īṣāli fī ḥāli aradta al-irjāʿa.", "id": "Simpan kwitansi kalau-kalau kamu ingin mengembalikan.", "t": 12}, {"n": "1719", "ar": "الضَّرِيبَةُ مَشْمُولَةٌ فِي السِّعْرِ.", "tr": "Aḍ-ḍarībatu mashmūlatun fī as-siʿri.", "id": "Pajak sudah termasuk dalam harga.", "t": 12}, {"n": "1720", "ar": "يُفَضِّلُ كَثِيرُونَ الشِّرَاءَ مِنَ الْمَتَاجِرِ الْإِلِكْتْرُونِيَّةِ.", "tr": "Yufaḍḍilu kathīrūna ash-shirāʾa mina al-matājiri al-iliktrūniyyati.", "id": "Banyak orang lebih suka berbelanja di toko online.", "t": 12}, {"n": "1721", "ar": "قَبْلَ أَنْ تَشْتَرِيَ اقْرَأِ التَّقْيِيمَاتِ.", "tr": "Qabla an tashtariya iqraʾi at-taqyīmāti.", "id": "Sebelum membeli, bacalah ulasannya.", "t": 12}, {"n": "1722", "ar": "أَشْعُرُ بِالنَّدَمِ بَعْدَ كُلِّ عَمَلِيَّةِ شِرَاءٍ مُتَسَرِّعَةٍ.", "tr": "Ashʿuru bi-n-nadami baʿda kulli ʿamaliyyati shirāʾin mutasarriʿatin.", "id": "Saya menyesal setelah setiap pembelian yang terburu-buru.", "t": 12}, {"n": "1723", "ar": "تَرْتَفِعُ الْأَسْعَارُ بِاسْتِمْرَارٍ وَالرَّوَاتِبُ ثَابِتَةٌ.", "tr": "Tartafiʿu al-asʿāru bi-istimrārin wa-r-rawātibu thābitatun.", "id": "Harga naik terus sementara gaji tetap.", "t": 12}, {"n": "1724", "ar": "نَحْتَاجُ إِلَى مُرَاجَعَةِ مَصَارِيفِنَا.", "tr": "Naḥtāju ilā murājaʿati maṣārīfinā.", "id": "Kita perlu meninjau pengeluaran kita.", "t": 12}, {"n": "1725", "ar": "الزِّحَامُ فِي الْمُدُنِ الْكَبِيرَةِ مُرْهِقٌ.", "tr": "Az-zaḥāmu fī al-mudūni al-kabīrati murhiqun.", "id": "Kemacetan di kota besar melelahkan.", "t": 13}, {"n": "1726", "ar": "أُفَضِّلُ اسْتِخْدَامَ وَسَائِلِ النَّقْلِ الْعَامِّ.", "tr": "Ufaḍḍilu istikhdāma wasāʾili an-naqli al-ʿāmmi.", "id": "Saya lebih suka memakai transportasi umum.", "t": 13}, {"n": "1727", "ar": "تَلَوُّثُ الْهَوَاءِ يُؤَثِّرُ عَلَى صِحَّتِنَا.", "tr": "Talawwuthu al-hawāʾi yuʾaththiru ʿalā ṣiḥḥatinā.", "id": "Polusi udara memengaruhi kesehatan kita.", "t": 13}, {"n": "1728", "ar": "يَجِبُ أَنْ نُقَلِّلَ مِنِ اسْتِخْدَامِ الْبَلَاسْتِيكِ.", "tr": "Yajibu an nuqallila min istikhdāmi al-balāstīki.", "id": "Kita harus mengurangi penggunaan plastik.", "t": 13}, {"n": "1729", "ar": "زَرَعْنَا أَشْجَارًا فِي الْحَيِّ.", "tr": "Zaraʿnā ashjāran fī al-ḥayyi.", "id": "Kami menanam pohon di lingkungan kami.", "t": 13}, {"n": "1730", "ar": "الْحَيَاةُ فِي الْقَرْيَةِ أَهْدَأُ لَكِنَّ الْخِدْمَاتِ أَقَلُّ.", "tr": "Al-ḥayātu fī al-qaryati ahdaʾu lakinna al-khidamāti aqallu.", "id": "Hidup di desa lebih tenang tapi layanannya lebih sedikit.", "t": 13}, {"n": "1731", "ar": "بُنِيَ مَرْكَزٌ تِجَارِيٌّ جَدِيدٌ بِجَانِبِ الْجَامِعَةِ.", "tr": "Buniya markazun tijāriyyun jadīdun bi-jānibi al-jāmiʿati.", "id": "Sebuah pusat perbelanjaan baru dibangun di samping universitas.", "t": 13}, {"n": "1732", "ar": "تُعَانِي الْمَدِينَةُ مِنْ نَقْصٍ فِي مَوَاقِفِ السَّيَّارَاتِ.", "tr": "Tuʿānī al-madīnatu min naqṣin fī mawāqifi as-sayyārāti.", "id": "Kota ini kekurangan tempat parkir.", "t": 13}, {"n": "1733", "ar": "أَصْبَحَ الْعَمَلُ عَنْ بُعْدٍ شَائِعًا.", "tr": "Aṣbaḥa al-ʿamalu ʿan buʿdin shāʾiʿan.", "id": "Kerja jarak jauh menjadi hal umum.", "t": 13}, {"n": "1734", "ar": "نُحَاوِلُ إِعَادَةَ تَدْوِيرِ النُّفَايَاتِ فِي الْبَيْتِ.", "tr": "Nuḥāwilu iʿādata tadwīri an-nufāyāti fī al-bayti.", "id": "Kami berusaha mendaur ulang sampah di rumah.", "t": 13}, {"n": "1735", "ar": "الْمَسَاحَاتُ الْخَضْرَاءُ ضَرُورِيَّةٌ لِلْمَدِينَةِ.", "tr": "Al-masāḥātu al-khaḍrāʾu ḍarūriyyatun lil-madīnati.", "id": "Ruang hijau penting bagi kota.", "t": 13}, {"n": "1736", "ar": "ارْتَفَعَتْ تَكَالِيفُ السَّكَنِ بِشَكْلٍ كَبِيرٍ.", "tr": "Irtafaʿat takālīfu as-sakani bi-shaklin kabīrin.", "id": "Biaya tempat tinggal naik drastis.", "t": 13}, {"n": "1737", "ar": "يَسْتَهْلِكُ هَذَا الْجِهَازُ طَاقَةً أَقَلَّ.", "tr": "Yastahliku hādhā al-jihāzu ṭāqatan aqalla.", "id": "Alat ini mengonsumsi energi lebih sedikit.", "t": 13}, {"n": "1738", "ar": "نَحْنُ بِحَاجَةٍ إِلَى حُلُولٍ مُسْتَدَامَةٍ.", "tr": "Naḥnu bi-ḥājatin ilā ḥulūlin mustadāmatin.", "id": "Kita butuh solusi berkelanjutan.", "t": 13}, {"n": "1739", "ar": "يُشَرِّفُنِي أَنْ أَدْعُوَكُمْ إِلَى حَفْلِ الِافْتِتَاحِ.", "tr": "Yusharrifunī an adʿuwakum ilā ḥafli al-iftitāḥi.", "id": "Saya merasa terhormat mengundang Anda ke acara pembukaan.", "t": 14}, {"n": "1740", "ar": "نَشْكُرُكُمْ عَلَى حُضُورِكُمْ وَمُشَارَكَتِكُمْ.", "tr": "Nashkurukum ʿalā ḥuḍūrikum wa-mushārakatikum.", "id": "Kami berterima kasih atas kehadiran dan partisipasi Anda.", "t": 14}, {"n": "1741", "ar": "أَعْتَذِرُ عَنْ عَدَمِ تَمَكُّنِي مِنَ الْحُضُورِ.", "tr": "Aʿtadhiru ʿan ʿadami tamakkunī mina al-ḥuḍūri.", "id": "Mohon maaf saya tidak dapat hadir.", "t": 14}, {"n": "1742", "ar": "يَسْعَدُنَا أَنْ نَسْتَقْبِلَكُمْ فِي أَيِّ وَقْتٍ.", "tr": "Yasʿaduna an nastaqbilakum fī ayyi waqtin.", "id": "Kami senang menyambut Anda kapan saja.", "t": 14}, {"n": "1743", "ar": "مَعَ أَطْيَبِ التَّمَنِّيَاتِ لَكُمْ بِالتَّوْفِيقِ.", "tr": "Maʿa aṭyabi at-tamanniyāti lakum bi-t-tawfīqi.", "id": "Dengan harapan terbaik agar Anda sukses.", "t": 14}, {"n": "1744", "ar": "نَأْمُلُ أَنْ تَكُونُوا بِخَيْرٍ وَصِحَّةٍ جَيِّدَةٍ.", "tr": "Naʾmulu an takūnū bi-khayrin wa-ṣiḥḥatin jayyidatin.", "id": "Kami berharap Anda dalam keadaan baik dan sehat.", "t": 14}, {"n": "1745", "ar": "أَشْكُرُ لَكُمْ حُسْنَ ضِيَافَتِكُمْ.", "tr": "Ashkuru lakum ḥusna ḍiyāfatikum.", "id": "Saya berterima kasih atas keramahan Anda.", "t": 14}, {"n": "1746", "ar": "هَلْ تَسْمَحُونَ لِي بِأَنْ أَقُولَ كَلِمَةً؟", "tr": "Hal tasmaḥūna lī bi-an aqūla kalimatan?", "id": "Bolehkah saya menyampaikan sepatah kata?", "t": 14}, {"n": "1747", "ar": "اسْمَحُوا لِي أَنْ أُقَدِّمَ نَفْسِي.", "tr": "Ismaḥū lī an uqaddima nafsī.", "id": "Izinkan saya memperkenalkan diri.", "t": 14}, {"n": "1748", "ar": "كَانَ مِنْ دَوَاعِي سُرُورِي أَنْ أَلْتَقِيَ بِكُمْ.", "tr": "Kāna min dawāʿī surūrī an altaqiya bikum.", "id": "Merupakan kebahagiaan saya bisa bertemu Anda.", "t": 14}, {"n": "1749", "ar": "نَتَطَلَّعُ إِلَى التَّعَاوُنِ مَعَكُمْ مُسْتَقْبَلًا.", "tr": "Nataṭallaʿu ilā at-taʿāwuni maʿakum mustaqbalan.", "id": "Kami menantikan kerja sama dengan Anda ke depan.", "t": 14}, {"n": "1750", "ar": "مَعَ خَالِصِ الشُّكْرِ وَالتَّقْدِيرِ.", "tr": "Maʿa khāliṣi ash-shukri wa-t-taqdīri.", "id": "Dengan ucapan terima kasih dan penghargaan yang tulus.", "t": 14}, {"n": "1751", "ar": "أَعْلَنَتِ الْحُكُومَةُ عَنْ خُطَّةٍ جَدِيدَةٍ لِلنَّقْلِ الْعَامِّ.", "tr": "Aʿlanati al-ḥukūmatu ʿan khuṭṭatin jadīdatin lil-naqli al-ʿāmmi.", "id": "Pemerintah mengumumkan rencana baru untuk transportasi umum.", "t": 15}, {"n": "1752", "ar": "بِحَسَبِ التَّقَارِيرِ، ارْتَفَعَتِ الْأَسْعَارُ هَذَا الشَّهْرَ.", "tr": "Bi-ḥasabi at-taqārīri, irtafaʿati al-asʿāru hādhā ash-shahra.", "id": "Menurut laporan, harga naik bulan ini.", "t": 15}, {"n": "1753", "ar": "وَقَعَ حَادِثٌ عَلَى الطَّرِيقِ السَّرِيعِ صَبَاحَ الْيَوْمِ.", "tr": "Waqaʿa ḥādithun ʿalā aṭ-ṭarīqi as-sarīʿi ṣabāḥa al-yawmi.", "id": "Terjadi kecelakaan di jalan tol pagi ini.", "t": 15}, {"n": "1754", "ar": "تَمَّ إِغْلَاقُ الطَّرِيقِ مُؤَقَّتًا لِأَسْبَابٍ أَمْنِيَّةٍ.", "tr": "Tamma ighlāqu aṭ-ṭarīqi muʾaqqatan li-asbābin amniyyatin.", "id": "Jalan ditutup sementara karena alasan keamanan.", "t": 15}, {"n": "1755", "ar": "أَفَادَتِ الْأَرْصَادُ الْجَوِّيَّةُ بِأَنَّ الْأَمْطَارَ سَتَسْتَمِرُّ.", "tr": "Afādati al-arṣādu al-jawwiyyatu bi-anna al-amṭāra sa-tastamirru.", "id": "Badan cuaca menyatakan bahwa hujan akan terus berlanjut.", "t": 15}, {"n": "1756", "ar": "افْتُتِحَ مَعْرِضُ الْكِتَابِ السَّنَوِيُّ أَمْسِ.", "tr": "Iftutiḥa maʿriḍu al-kitābi as-sanawiyyu amsi.", "id": "Pameran buku tahunan dibuka kemarin.", "t": 15}, {"n": "1757", "ar": "شَارَكَ فِيهِ أَكْثَرُ مِنْ مِائَةِ نَاشِرٍ.", "tr": "Shāraka fīhi akthara min miʾati nāshirin.", "id": "Lebih dari seratus penerbit ikut serta di dalamnya.", "t": 15}, {"n": "1758", "ar": "أُجْرِيَتِ الِانْتِخَابَاتُ الْمَحَلِّيَّةُ فِي أَجْوَاءٍ هَادِئَةٍ.", "tr": "Ujriyati al-intikhābātu al-maḥalliyyatu fī ajwāʾin hādiʾatin.", "id": "Pemilu lokal diadakan dalam suasana tenang.", "t": 15}, {"n": "1759", "ar": "يُتَوَقَّعُ أَنْ تَنْخَفِضَ دَرَجَاتُ الْحَرَارَةِ خِلَالَ الْأَيَّامِ الْقَادِمَةِ.", "tr": "Yutawaqqaʿu an tankhafiḍa darajātu al-ḥarārati khilāla al-ayyāmi al-qādimati.", "id": "Diperkirakan suhu akan turun dalam beberapa hari mendatang.", "t": 15}, {"n": "1760", "ar": "أَكَّدَ الْمُتَحَدِّثُ أَنَّ الْوَضْعَ تَحْتَ السَّيْطَرَةِ.", "tr": "Akkada al-mutaḥaddithu anna al-waḍʿa taḥta as-sayṭarati.", "id": "Juru bicara menegaskan bahwa keadaan terkendali.", "t": 15}, {"n": "1761", "ar": "لَمْ يَصْدُرْ أَيُّ تَعْلِيقٍ رَسْمِيٍّ حَتَّى الْآنَ.", "tr": "Lam yaṣdur ayyu taʿlīqin rasmiyyin ḥattā al-āna.", "id": "Belum ada komentar resmi sampai sekarang.", "t": 15}, {"n": "1762", "ar": "انْتَشَرَتِ الشَّائِعَاتُ قَبْلَ أَنْ يَصْدُرَ الْبَيَانُ.", "tr": "Intasharati ash-shāʾiʿātu qabla an yaṣdura al-bayānu.", "id": "Rumor menyebar sebelum pernyataan dikeluarkan.", "t": 15}, {"n": "1763", "ar": "شَهِدَتِ الْمَدِينَةُ حَدَثًا رِيَاضِيًّا كَبِيرًا.", "tr": "Shahidati al-madīnatu ḥadathan riyāḍiyyan kabīran.", "id": "Kota ini menyaksikan acara olahraga besar.", "t": 15}, {"n": "1764", "ar": "كَانَ الْحُضُورُ أَكْبَرَ مِمَّا تَوَقَّعَ الْمُنَظِّمُونَ.", "tr": "Kāna al-ḥuḍūru akbara mimmā tawaqqaʿa al-munaẓẓimūna.", "id": "Kehadiran lebih besar daripada yang diperkirakan panitia.", "t": 15}, {"n": "1765", "ar": "دَعَا الْخُبَرَاءُ إِلَى تَرْشِيدِ اسْتِهْلَاكِ الْمَاءِ.", "tr": "Daʿā al-khubarāʾu ilā tarshīdi istihlāki al-māʾi.", "id": "Para ahli menyerukan penghematan penggunaan air.", "t": 15}, {"n": "1766", "ar": "صَدَرَ قَرَارٌ جَدِيدٌ يَخُصُّ الْمَدَارِسَ.", "tr": "Ṣadara qarārun jadīdun yakhuṣṣu al-madārisa.", "id": "Terbit keputusan baru terkait sekolah.", "t": 15}, {"n": "1767", "ar": "تَابَعْتُ الْخَبَرَ مُنْذُ الصَّبَاحِ.", "tr": "Tābaʿtu al-khabara mundhu aṣ-ṣabāḥi.", "id": "Saya mengikuti beritanya sejak pagi.", "t": 15}, {"n": "1768", "ar": "لَيْسَ كُلُّ مَا يُنْشَرُ عَلَى الْإِنْتَرْنِتِ دَقِيقًا.", "tr": "Laysa kullu mā yunsharu ʿalā al-intirniti daqīqan.", "id": "Tidak semua yang diterbitkan di internet itu akurat.", "t": 15}, {"n": "1769", "ar": "فِي أَحَدِ الْأَيَّامِ، خَرَجْتُ لِأَشْتَرِيَ بَعْضَ الْأَغْرَاضِ.", "tr": "Fī aḥadi al-ayyāmi, kharajtu li-ashtariya baʿḍa al-aghrāḍi.", "id": "Suatu hari saya keluar untuk membeli beberapa barang.", "t": 16}, {"n": "1770", "ar": "وَبَيْنَمَا كُنْتُ أَسِيرُ فِي الشَّارِعِ، سَمِعْتُ أَحَدَهُمْ يُنَادِينِي.", "tr": "Wa-baynamā kuntu asīru fī ash-shāriʿi, samiʿtu aḥadahum yunādīnī.", "id": "Ketika saya berjalan di jalan, saya mendengar seseorang memanggil saya.", "t": 16}, {"n": "1771", "ar": "الْتَفَتُّ فَرَأَيْتُ صَدِيقًا قَدِيمًا.", "tr": "Iltafattu fa-raʾaytu ṣadīqan qadīman.", "id": "Saya menoleh dan melihat seorang teman lama.", "t": 16}, {"n": "1772", "ar": "لَمْ أُصَدِّقْ عَيْنَيَّ فِي الْبِدَايَةِ.", "tr": "Lam uṣaddiq ʿaynayya fī al-bidāyati.", "id": "Awalnya saya tidak percaya pada mata saya.", "t": 16}, {"n": "1773", "ar": "تَعَانَقْنَا وَسَأَلْتُهُ عَنْ أَحْوَالِهِ.", "tr": "Taʿānaqnā wa-saʾaltuhu ʿan aḥwālihi.", "id": "Kami berpelukan dan saya menanyakan kabarnya.", "t": 16}, {"n": "1774", "ar": "قَالَ إِنَّهُ عَادَ مِنَ الْخَارِجِ مُنْذُ أُسْبُوعٍ.", "tr": "Qāla innahu ʿāda mina al-khāriji mundhu usbūʿin.", "id": "Katanya dia pulang dari luar negeri seminggu lalu.", "t": 16}, {"n": "1775", "ar": "جَلَسْنَا فِي مَقْهًى قَرِيبٍ وَتَحَدَّثْنَا لِسَاعَاتٍ.", "tr": "Jalasnā fī maqhan qarībin wa-taḥaddathnā li-sāʿātin.", "id": "Kami duduk di kafe terdekat dan mengobrol berjam-jam.", "t": 16}, {"n": "1776", "ar": "ثُمَّ تَذَكَّرْتُ أَنَّ لَدَيَّ مَوْعِدًا مُهِمًّا.", "tr": "Thumma tadhakkartu anna ladayya mawʿidan muhimman.", "id": "Lalu saya teringat saya punya janji penting.", "t": 16}, {"n": "1777", "ar": "رَكَضْتُ إِلَى الْمَحَطَّةِ وَأَنَا أَلْهَثُ.", "tr": "Rakaḍtu ilā al-maḥaṭṭati wa-anā alhathu.", "id": "Saya berlari ke stasiun sambil terengah-engah.", "t": 16}, {"n": "1778", "ar": "وَصَلْتُ فِي اللَّحْظَةِ الْأَخِيرَةِ تَقْرِيبًا.", "tr": "Waṣaltu fī al-laḥẓati al-akhīrati taqrīban.", "id": "Saya tiba hampir di detik terakhir.", "t": 16}, {"n": "1779", "ar": "وَمَا إِنْ جَلَسْتُ حَتَّى تَحَرَّكَ الْقِطَارُ.", "tr": "Wa-mā in jalastu ḥattā taḥarraka al-qiṭāru.", "id": "Begitu saya duduk, kereta pun berjalan.", "t": 16}, {"n": "1780", "ar": "كَانَ الْيَوْمُ طَوِيلًا وَمُمْتِعًا فِي آنٍ وَاحِدٍ.", "tr": "Kāna al-yawmu ṭawīlan wa-mumtiʿan fī ānin wāḥidin.", "id": "Hari itu panjang dan menyenangkan sekaligus.", "t": 16}, {"n": "1781", "ar": "حِينَمَا كُنْتُ طِفْلًا، كَانَتْ جَدَّتِي تَحْكِي لِي قِصَصًا قَبْلَ النَّوْمِ.", "tr": "Ḥīnamā kuntu ṭiflan, kānat jaddatī taḥkī lī qiṣaṣan qabla an-nawmi.", "id": "Ketika saya kecil, nenek saya biasa menceritakan kisah sebelum tidur.", "t": 16}, {"n": "1782", "ar": "كُنَّا نَجْتَمِعُ حَوْلَهَا وَنَسْتَمِعُ بِشَوْقٍ.", "tr": "Kunnā najtamiʿu ḥawlahā wa-nastamiʿu bi-shawqin.", "id": "Kami berkumpul di sekelilingnya dan mendengarkan dengan antusias.", "t": 16}, {"n": "1783", "ar": "وَفِي نِهَايَةِ كُلِّ قِصَّةٍ كَانَتْ تَقُولُ لَنَا حِكْمَةً.", "tr": "Wa-fī nihāyati kulli qiṣṣatin kānat taqūlu lanā ḥikmatan.", "id": "Dan di akhir setiap kisah, dia menyampaikan sebuah hikmah kepada kami.", "t": 16}, {"n": "1784", "ar": "مَا زِلْتُ أَتَذَكَّرُ صَوْتَهَا الدَّافِئَ.", "tr": "Mā ziltu atadhakkaru ṣawtahā ad-dāfiʾa.", "id": "Saya masih mengingat suaranya yang hangat.", "t": 16}, {"n": "1785", "ar": "ذَاتَ مَرَّةٍ، ضَاعَ مِنِّي كَلْبِي فِي الْغَابَةِ.", "tr": "Dhāta marratin, ḍāʿa minnī kalbī fī al-ghābati.", "id": "Suatu kali, anjing saya hilang di hutan.", "t": 16}, {"n": "1786", "ar": "بَحَثْنَا عَنْهُ حَتَّى الْمَسَاءِ دُونَ فَائِدَةٍ.", "tr": "Baḥathnā ʿanhu ḥattā al-masāʾi dūna fāʾidatin.", "id": "Kami mencarinya sampai sore tanpa hasil.", "t": 16}, {"n": "1787", "ar": "وَفِي الصَّبَاحِ التَّالِي، وَجَدْنَاهُ أَمَامَ الْبَابِ.", "tr": "Wa-fī aṣ-ṣabāḥi at-tālī, wajadnāhu amāma al-bābi.", "id": "Keesokan paginya, kami menemukannya di depan pintu.", "t": 16}, {"n": "1788", "ar": "كَانَتْ فَرْحَتُنَا لَا تُوصَفُ.", "tr": "Kānat farḥatunā lā tūṣafu.", "id": "Kegembiraan kami tak terlukiskan.", "t": 16}, {"n": "1789", "ar": "وَهَكَذَا انْتَهَتِ الْقِصَّةُ بِسَلَامٍ.", "tr": "Wa-hākadhā intahati al-qiṣṣatu bi-salāmin.", "id": "Demikianlah kisahnya berakhir dengan selamat.", "t": 16}, {"n": "1790", "ar": "لَقَدْ تَعَلَّمْتُ مِنْ تِلْكَ الْحَادِثَةِ أَلَّا أَتْرُكَ شَيْئًا ثَمِينًا بِلَا مُرَاقَبَةٍ.", "tr": "Laqad taʿallamtu min tilka al-ḥādithati allā atruka shayʾan thamīnan bi-lā murāqabatin.", "id": "Saya belajar dari kejadian itu untuk tidak meninggalkan barang berharga tanpa pengawasan.", "t": 16}, {"n": "1791", "ar": "تَقَعُ الْقَرْيَةُ عَلَى سَفْحِ جَبَلٍ تُحِيطُ بِهِ الْغَابَاتُ.", "tr": "Taqaʿu al-qaryatu ʿalā safḥi jabalin tuḥīṭu bihi al-ghābātu.", "id": "Desa itu terletak di lereng gunung yang dikelilingi hutan.", "t": 17}, {"n": "1792", "ar": "بُيُوتُهَا صَغِيرَةٌ وَمَبْنِيَّةٌ مِنَ الْحَجَرِ.", "tr": "Buyūtuhā ṣaghīratun wa-mabniyyatun mina al-ḥajari.", "id": "Rumah-rumahnya kecil dan terbuat dari batu.", "t": 17}, {"n": "1793", "ar": "يَتَمَيَّزُ سُكَّانُهَا بِالْكَرَمِ وَالْبَسَاطَةِ.", "tr": "Yatamayyazu sukkānuhā bi-l-karami wa-l-basāṭati.", "id": "Penduduknya dikenal ramah dan sederhana.", "t": 17}, {"n": "1794", "ar": "الْهَوَاءُ هُنَاكَ نَقِيٌّ وَالْجَوُّ مُنْعِشٌ.", "tr": "Al-hawāʾu hunāka naqiyyun wa-l-jawwu munʿishun.", "id": "Udara di sana bersih dan cuacanya menyegarkan.", "t": 17}, {"n": "1795", "ar": "هِيَ امْرَأَةٌ هَادِئَةُ الطَّبْعِ، قَوِيَّةُ الشَّخْصِيَّةِ.", "tr": "Hiya imraʾatun hādiʾatu aṭ-ṭabʿi, qawiyyatu ash-shakhṣiyyati.", "id": "Dia perempuan yang berperangai tenang dan berkepribadian kuat.", "t": 17}, {"n": "1796", "ar": "تَتَحَدَّثُ بِبُطْءٍ وَتَخْتَارُ كَلِمَاتِهَا بِعِنَايَةٍ.", "tr": "Tataḥaddathu bi-buṭʾin wa-takhtāru kalimātihā bi-ʿināyatin.", "id": "Dia berbicara pelan dan memilih kata-katanya dengan hati-hati.", "t": 17}, {"n": "1797", "ar": "يُعْرَفُ عَنْهَا حُبُّهَا لِلنِّظَامِ وَالدِّقَّةِ.", "tr": "Yuʿrafu ʿanhā ḥubbuhā lil-niẓāmi wa-d-diqqati.", "id": "Dia dikenal menyukai keteraturan dan ketelitian.", "t": 17}, {"n": "1798", "ar": "كَانَ جَدِّي رَجُلًا طَوِيلَ الْقَامَةِ، عَرِيضَ الْكَتِفَيْنِ.", "tr": "Kāna jaddī rajulan ṭawīla al-qāmati, ʿarīḍa al-katifayni.", "id": "Kakek saya seorang pria tinggi dan berbahu lebar.", "t": 17}, {"n": "1799", "ar": "ابْتِسَامَتُهُ لَا تُفَارِقُ وَجْهَهُ.", "tr": "Ibtisāmatuhu lā tufāriqu wajhahu.", "id": "Senyumnya tak pernah lepas dari wajahnya.", "t": 17}, {"n": "1800", "ar": "الْغُرْفَةُ مُضَاءَةٌ بِنُورٍ خَافِتٍ يُضْفِي عَلَيْهَا دِفْئًا.", "tr": "Al-ghurfatu muḍāʾatun bi-nūrin khāfitin yuḍfī ʿalayhā difʾan.", "id": "Ruangan itu diterangi cahaya redup yang memberinya kehangatan.", "t": 17}, {"n": "1801", "ar": "تَتَوَسَّطُ الْمَكَانَ طَاوِلَةٌ خَشَبِيَّةٌ قَدِيمَةٌ.", "tr": "Tatawassaṭu al-makāna ṭāwilatun khashabiyyatun qadīmatun.", "id": "Di tengah tempat itu ada sebuah meja kayu tua.", "t": 17}, {"n": "1802", "ar": "عَلَى الْجُدْرَانِ لَوْحَاتٌ تَحْكِي تَارِيخَ الْعَائِلَةِ.", "tr": "ʿAlā al-judrāni lawḥātun taḥkī tārīkha al-ʿāʾilati.", "id": "Di dinding ada lukisan yang menceritakan sejarah keluarga.", "t": 17}, {"n": "1803", "ar": "رَائِحَةُ الْقَهْوَةِ تَمْلَأُ الْمَكَانَ.", "tr": "Rāʾiḥatu al-qahwati tamlaʾu al-makāna.", "id": "Aroma kopi memenuhi tempat itu.", "t": 17}, {"n": "1804", "ar": "الْمَقْهَى يَعُجُّ بِالزَّبَائِنِ فِي الْمَسَاءِ.", "tr": "Al-maqhā yaʿujju bi-z-zabāʾini fī al-masāʾi.", "id": "Kafe itu ramai pengunjung di malam hari.", "t": 17}, {"n": "1805", "ar": "تَبْدُو الْمَدِينَةُ مِنْ بَعِيدٍ كَلَوْحَةٍ مُضِيئَةٍ.", "tr": "Tabdū al-madīnatu min baʿīdin ka-lawḥatin muḍīʾatin.", "id": "Dari kejauhan kota tampak seperti lukisan bercahaya.", "t": 17}, {"n": "1806", "ar": "هُوَ شَخْصٌ يُحِبُّ الْمُغَامَرَةَ وَلَا يَخَافُ الْمَجْهُولَ.", "tr": "Huwa shakhṣun yuḥibbu al-mughāmarata wa-lā yakhāfu al-majhūla.", "id": "Dia orang yang suka petualangan dan tak takut pada hal yang tak diketahui.", "t": 17}, {"n": "1807", "ar": "كُلُّ مَنْ يَعْرِفُهُ يَصِفُهُ بِالصِّدْقِ وَالْأَمَانَةِ.", "tr": "Kullu man yaʿrifuhu yaṣifuhu bi-ṣ-ṣidqi wa-l-amānati.", "id": "Semua yang mengenalnya menyebutnya jujur dan amanah.", "t": 17}, {"n": "1808", "ar": "الْمَنْظَرُ مِنْ هُنَا يَسْلُبُ الْأَنْفَاسَ.", "tr": "Al-manẓaru min hunā yaslubu al-anfāsa.", "id": "Pemandangan dari sini memukau.", "t": 17}, {"n": "1809", "ar": "أَوَدُّ أَنْ أُقَدِّمَ شَكْوَى بِخُصُوصِ الْخِدْمَةِ الَّتِي تَلَقَّيْتُهَا.", "tr": "Awaddu an uqaddima shakwā bi-khuṣūṣi al-khidmati allatī talaqqaytuhā.", "id": "Saya ingin mengajukan keluhan tentang layanan yang saya terima.", "t": 18}, {"n": "1810", "ar": "لَمْ يَكُنِ الْمُنْتَجُ مُطَابِقًا لِلْوَصْفِ.", "tr": "Lam yakuni al-muntaju muṭābiqan lil-waṣfi.", "id": "Barangnya tidak sesuai dengan deskripsi.", "t": 18}, {"n": "1811", "ar": "أَطْلُبُ اسْتِرْدَادَ الْمَبْلَغِ أَوْ اسْتِبْدَالَ الْقِطْعَةِ.", "tr": "Aṭlubu istirdāda al-mablaghi aw istibdāla al-qiṭʿati.", "id": "Saya minta uang dikembalikan atau barang diganti.", "t": 18}, {"n": "1812", "ar": "نَعْتَذِرُ عَنِ الْإِزْعَاجِ وَسَنَعْمَلُ عَلَى حَلِّ الْمُشْكِلَةِ فَوْرًا.", "tr": "Naʿtadhiru ʿani al-izʿāji wa-sa-naʿmalu ʿalā ḥalli al-mushkilati fawran.", "id": "Kami mohon maaf atas ketidaknyamanan dan akan segera menyelesaikan masalah.", "t": 18}, {"n": "1813", "ar": "هَلْ يُمْكِنُ أَنْ نَصِلَ إِلَى حَلٍّ وَسَطٍ؟", "tr": "Hal yumkinu an naṣila ilā ḥallin wasaṭin?", "id": "Bisakah kita mencapai jalan tengah?", "t": 18}, {"n": "1814", "ar": "أَنَا مُسْتَعِدٌّ لِلتَّنَازُلِ عَنْ بَعْضِ الشُّرُوطِ.", "tr": "Anā mustaʿiddun lil-tanāzuli ʿan baʿḍi ash-shurūṭi.", "id": "Saya bersedia mengalah pada sebagian syarat.", "t": 18}, {"n": "1815", "ar": "لَنْ أُوَافِقَ إِلَّا إِذَا تَمَّ تَعْدِيلُ الْعَقْدِ.", "tr": "Lan uwāfiqa illā idhā tamma taʿdīlu al-ʿaqdi.", "id": "Saya tidak akan setuju kecuali kontrak diubah.", "t": 18}, {"n": "1816", "ar": "السِّعْرُ الَّذِي عَرَضْتُمُوهُ أَعْلَى مِنْ مِيزَانِيَّتِنَا.", "tr": "As-siʿru alladhī ʿaraḍtumūhu aʿlā min mīzāniyyatinā.", "id": "Harga yang Anda tawarkan di atas anggaran kami.", "t": 18}, {"n": "1817", "ar": "نَحْنُ نُقَدِّرُ عَرْضَكُمْ لَكِنَّنَا نَحْتَاجُ إِلَى تَخْفِيضٍ.", "tr": "Naḥnu nuqaddiru ʿarḍakum lakinnanā naḥtāju ilā takhfīḍin.", "id": "Kami menghargai tawaran Anda tapi kami butuh potongan harga.", "t": 18}, {"n": "1818", "ar": "إِذَا قَبِلْتُمْ بِهَذَا الشَّرْطِ فَسَنُوَقِّعُ الْيَوْمَ.", "tr": "Idhā qabiltum bi-hādhā ash-sharṭi fa-sa-nuwaqqiʿu al-yawma.", "id": "Jika Anda menerima syarat ini, kami tanda tangan hari ini.", "t": 18}, {"n": "1819", "ar": "حَدَثَ سُوءُ فَهْمٍ بَيْنَنَا وَيَجِبُ أَنْ نُوَضِّحَهُ.", "tr": "Ḥadatha sūʾu fahmin baynanā wa-yajibu an nuwaḍḍiḥahu.", "id": "Terjadi salah paham di antara kita dan kita harus meluruskannya.", "t": 18}, {"n": "1820", "ar": "لَمْ أَقْصِدْ أَنْ أَجْرَحَ مَشَاعِرَكَ.", "tr": "Lam aqṣid an ajraḥa mashāʿiraka.", "id": "Saya tidak bermaksud melukai perasaanmu.", "t": 18}, {"n": "1821", "ar": "أَتَفَهَّمُ مَوْقِفَكَ لَكِنَّ لِي وِجْهَةَ نَظَرٍ أُخْرَى.", "tr": "Atafahhamu mawqifaka lakinna lī wijhata naẓarin ukhrā.", "id": "Saya memahami posisimu tapi saya punya sudut pandang lain.", "t": 18}, {"n": "1822", "ar": "دَعْنَا نَتَحَدَّثْ بِهُدُوءٍ وَنَبْحَثْ عَنْ حَلٍّ.", "tr": "Daʿnā nataḥaddath bi-hudūʾin wa-nabḥath ʿan ḥallin.", "id": "Mari bicara dengan tenang dan mencari solusi.", "t": 18}, {"n": "1823", "ar": "لَا فَائِدَةَ مِنَ الْجِدَالِ إِذَا لَمْ نَسْتَمِعْ لِبَعْضِنَا.", "tr": "Lā fāʾidata mina al-jidāli idhā lam nastamiʿ li-baʿḍinā.", "id": "Tak ada gunanya berdebat jika kita tak saling mendengarkan.", "t": 18}, {"n": "1824", "ar": "يَبْدُو أَنَّ هُنَاكَ خَطَأً فِي الْحِسَابِ.", "tr": "Yabdū anna hunāka khaṭaʾan fī al-ḥisābi.", "id": "Sepertinya ada kesalahan hitung.", "t": 18}, {"n": "1825", "ar": "طَلَبْتُ مِنْهُمْ أَنْ يُعِيدُوا النَّظَرَ فِي الْقَرَارِ.", "tr": "Ṭalabtu minhum an yuʿīdū an-naẓara fī al-qarāri.", "id": "Saya meminta mereka meninjau kembali keputusan itu.", "t": 18}, {"n": "1826", "ar": "رَفَضُوا طَلَبِي بِحُجَّةِ أَنَّ الْمُدَّةَ انْتَهَتْ.", "tr": "Rafaḍū ṭalabī bi-ḥujjati anna al-muddata intahat.", "id": "Mereka menolak permintaan saya dengan alasan waktunya habis.", "t": 18}, {"n": "1827", "ar": "سَأَرْفَعُ الْأَمْرَ إِلَى الْإِدَارَةِ إِذَا لَزِمَ.", "tr": "Sa-arfaʿu al-amra ilā al-idārati idhā lazima.", "id": "Saya akan mengajukan hal ini ke manajemen bila perlu.", "t": 18}, {"n": "1828", "ar": "أَرْجُو أَنْ نُنْهِيَ هَذَا الْأَمْرَ وُدِّيًّا.", "tr": "Arjū an nunhiya hādhā al-amra wuddiyyan.", "id": "Saya harap kita menyelesaikan ini secara baik-baik.", "t": 18}, {"n": "1829", "ar": "نُنَظِّمُ رِحْلَةً جَمَاعِيَّةً إِلَى الْجَبَلِ نِهَايَةَ الشَّهْرِ.", "tr": "Nunaẓẓimu riḥlatan jamāʿiyyatan ilā al-jabali nihāyata ash-shahri.", "id": "Kami mengadakan perjalanan bersama ke gunung akhir bulan.", "t": 19}, {"n": "1830", "ar": "مَنْ يَرْغَبُ فِي الْمُشَارَكَةِ فَلْيُسَجِّلْ اسْمَهُ.", "tr": "Man yarghabu fī al-mushārakati fa-l-yusajjil ismahu.", "id": "Siapa yang ingin ikut, silakan mendaftarkan namanya.", "t": 19}, {"n": "1831", "ar": "عَدَدُ الْمَقَاعِدِ مَحْدُودٌ فَالْأَفْضَلُ أَنْ تُسْرِعُوا.", "tr": "ʿAdadu al-maqāʿidi maḥdūdun fa-l-afḍalu an tusriʿū.", "id": "Jumlah kursi terbatas, jadi sebaiknya Anda cepat.", "t": 19}, {"n": "1832", "ar": "سَنَتَقَاسَمُ تَكَالِيفَ الْمُوَاصَلَاتِ بَيْنَنَا.", "tr": "Sa-nataqāsamu takālīfa al-muwāṣalāti baynanā.", "id": "Kita akan membagi biaya transportasi di antara kita.", "t": 19}, {"n": "1833", "ar": "كُلُّ وَاحِدٍ مِنَّا سَيُحْضِرُ طَبَقًا مِنَ الطَّعَامِ.", "tr": "Kullu wāḥidin minnā sa-yuḥḍiru ṭabaqan mina aṭ-ṭaʿāmi.", "id": "Setiap dari kita akan membawa satu hidangan.", "t": 19}, {"n": "1834", "ar": "يَجِبُ أَنْ نَتَّفِقَ عَلَى جَدْوَلٍ زَمَنِيٍّ وَاضِحٍ.", "tr": "Yajibu an nattafiqa ʿalā jadwalin zamaniyyin wāḍiḥin.", "id": "Kita harus sepakat pada jadwal yang jelas.", "t": 19}, {"n": "1835", "ar": "سَنَنْطَلِقُ فِي السَّادِسَةِ صَبَاحًا وَلَنْ نَنْتَظِرَ أَحَدًا.", "tr": "Sa-nanṭaliqu fī as-sādisati ṣabāḥan wa-lan nantaẓira aḥadan.", "id": "Kita berangkat jam enam pagi dan tidak akan menunggu siapa pun.", "t": 19}, {"n": "1836", "ar": "مَنْ سَيَتَوَلَّى الْإِشْرَافَ عَلَى الْحَجْزِ؟", "tr": "Man sa-yatawallā al-ishrāfa ʿalā al-ḥajzi?", "id": "Siapa yang akan menangani pemesanan?", "t": 19}, {"n": "1837", "ar": "تَطَوَّعْتُ لِلتَّنْسِيقِ مَعَ الْفُنْدُقِ.", "tr": "Taṭawwaʿtu lil-tansīqi maʿa al-funduqi.", "id": "Saya menawarkan diri berkoordinasi dengan hotel.", "t": 19}, {"n": "1838", "ar": "أَرْسِلُوا لِي أَسْمَاءَكُمْ قَبْلَ يَوْمِ الْخَمِيسِ.", "tr": "Arsilū lī asmāʾakum qabla yawmi al-khamīsi.", "id": "Kirimkan nama-nama Anda kepada saya sebelum hari Kamis.", "t": 19}, {"n": "1839", "ar": "قَدْ نُضْطَرُّ إِلَى تَغْيِيرِ الْمَوْعِدِ إِنْ سَاءَ الطَّقْسُ.", "tr": "Qad nuḍṭarru ilā taghyīri al-mawʿidi in sāʾa aṭ-ṭaqsu.", "id": "Kita mungkin terpaksa mengubah jadwal jika cuaca memburuk.", "t": 19}, {"n": "1840", "ar": "سَنُوَزِّعُ الْمُهِمَّاتِ بِالْعَدْلِ ب ṣaḥīḥun juzʾiyyan faqaṭ.", "id": "Apa yang kamu katakan hanya benar sebagian.", "t": 32}, {"n": "2040", "ar": "دَعْنَا نَسْتَمِعْ إِلَى الْجَمِيعِ قَبْلَ أَنْ نَتَّخِذَ الْقَرَارَ.", "tr": "Daʿnā nastamiʿ ilā al-jamīʿi qabla an nattakhidha al-qarāra.", "id": "Mari kita dengarkan semua orang sebelum kita memutuskan.", "t": 32}, {"n": "2041", "ar": "لَا أُرِيدُ أَنْ أَقَاطِعَكَ، لَكِنْ عِنْدِي سُؤَالٌ.", "tr": "Lā urīdu an uqāṭiʿaka, lākin ʿindī suʾālun.", "id": "Saya tidak ingin menyela, tetapi saya punya pertanyaan.", "t": 32}, {"n": "2042", "ar": "أَعْتَقِدُ أَنَّنَا نَسْتَطِيعُ الْوُصُولَ إِلَى حَلٍّ وَسَطٍ.", "tr": "Aʿtaqidu annanā nastaṭīʿu al-wuṣūla ilā ḥallin wasaṭin.", "id": "Saya yakin kita bisa mencapai jalan tengah.", "t": 32}, {"n": "2043", "ar": "مِنَ الْأَفْضَلِ أَنْ نَتَحَدَّثَ بِهُدُوءٍ.", "tr": "Mina al-afḍali an natakallama bi-hudūʾin.", "id": "Sebaiknya kita berbicara dengan tenang.", "t": 32}, {"n": "2044", "ar": "هَلْ يُمْكِنُكَ أَنْ تُوَضِّحَ مَا تَقْصِدُهُ؟", "tr": "Hal yumkinuka an tuwaḍḍiḥa mā taqṣiduhu?", "id": "Bisakah kamu menjelaskan apa yang kamu maksud?", "t": 32}, {"n": "2045", "ar": "أَنَا لَا أُوَافِقُ تَمَامًا، وَلَكِنِّي أَفْهَمُ سَبَبَكَ.", "tr": "Anā lā uwāfiqu tamāman, wa lākinnī afhamu sababaka.", "id": "Saya tidak sepenuhnya setuju, tetapi saya mengerti alasanmu.", "t": 32}, {"n": "2046", "ar": "لِنَتَّفِقْ عَلَى أَنْ نَخْتَلِفَ فِي هَذِهِ النُّقْطَةِ.", "tr": "Linattafiq ʿalā an nakhtalifa fī hādhihi an-nuqṭati.", "id": "Mari kita sepakat untuk berbeda pendapat dalam hal ini.", "t": 32}, {"n": "2047", "ar": "مِنْ فَضْلِكَ، اخْفِضْ صَوْتَكَ قَلِيلًا.", "tr": "Min faḍlika, akhfiḍ ṣawtaka qalīlan.", "id": "Tolong pelankan sedikit suaramu.", "t": 32}, {"n": "2048", "ar": "لَا أَقْصِدُ الْإِسَاءَةَ إِلَيْكَ، فَقَطْ أُرِيدُ الْوُضُوحَ.", "tr": "Lā aqṣidu al-isāʾata ilayka, faqaṭ urīdu al-wuḍūḥa.", "id": "Saya tidak bermaksud menyinggungmu, saya hanya ingin jelas.", "t": 32}, {"n": "2049", "ar": "دَعْنِي أُلَخِّصْ مَا اتَّفَقْنَا عَلَيْهِ.", "tr": "Daʿnī ulakhkhiṣ mā ittafaqnā ʿalayhi.", "id": "Biar saya ringkas apa yang telah kita sepakati.", "t": 32}, {"n": "2050", "ar": "رُبَّمَا أَخْطَأْتُ فِي فَهْمِ كَلَامِكَ.", "tr": "Rubbamā akhṭaʾtu fī fahmi kalāmika.", "id": "Mungkin saya salah memahami perkataanmu.", "t": 32}, {"n": "2051", "ar": "مَا رَأْيُكُمْ أَنْ نُؤَجِّلَ الْقَرَارَ إِلَى الْغَدِ؟", "tr": "Mā raʾyukum an nuʾajjila al-qarāra ilā al-ghadi?", "id": "Bagaimana kalau kita tunda keputusan sampai besok?", "t": 32}, {"n": "2052", "ar": "أَشْكُرُكُمْ عَلَى هَذَا النِّقَاشِ الْمُفِيدِ.", "tr": "Ashkurukum ʿalā hādhā an-niqāshi al-mufīdi.", "id": "Terima kasih atas diskusi yang bermanfaat ini.", "t": 32}, {"n": "2053", "ar": "أُفَضِّلُ أَنْ نَسْمَعَ الْأَدِلَّةَ قَبْلَ الْحُكْمِ.", "tr": "Ufaḍḍilu an nasmaʿa al-adillata qabla al-ḥukmi.", "id": "Saya lebih suka kita mendengar bukti dulu sebelum menilai.", "t": 32}, {"n": "2054", "ar": "لَيْتَنِي تَعَلَّمْتُ اللُّغَةَ مُنْذُ سَنَوَاتٍ.", "tr": "Laytanī taʿallamtu al-lughata mundhu sanawātin.", "id": "Andai saja saya belajar bahasa itu sejak bertahun-tahun lalu.", "t": 33}, {"n": "2055", "ar": "لَوْ كُنْتُ غَنِيًّا لَسَافَرْتُ حَوْلَ الْعَالَمِ.", "tr": "Law kuntu ghaniyyan lasāfartu ḥawla al-ʿālami.", "id": "Seandainya saya kaya, saya akan berkeliling dunia.", "t": 33}, {"n": "2056", "ar": "لَوْ دَرَسْتُ أَكْثَرَ لَنَجَحْتُ فِي الِامْتِحَانِ.", "tr": "Law darastu akthara lanajaḥtu fī al-imtiḥāni.", "id": "Seandainya saya belajar lebih banyak, saya pasti lulus ujian.", "t": 33}, {"n": "2057", "ar": "أَتَمَنَّى أَنْ تَكُونَ الْحَيَاةُ أَسْهَلَ قَلِيلًا.", "tr": "Atamannā an takūna al-ḥayātu ashala qalīlan.", "id": "Saya berharap hidup ini sedikit lebih mudah.", "t": 33}, {"n": "2058", "ar": "نَدِمْتُ عَلَى مَا قُلْتُهُ لَهُ أَمْسِ.", "tr": "Nadimtu ʿalā mā qultuhu lahu amsi.", "id": "Saya menyesal atas apa yang saya katakan kepadanya kemarin.", "t": 33}, {"n": "2059", "ar": "لَوْ عَلِمْتُ بِالْخَبَرِ لَأَخْبَرْتُكَ.", "tr": "Law ʿalimtu bil-khabari laʾakhbartuka.", "id": "Seandainya saya tahu kabarnya, saya pasti memberitahumu.", "t": 33}, {"n": "2060", "ar": "إِذَا تَأَخَّرْتَ فَسَأَبْدَأُ بِدُونِكَ.", "tr": "Idhā taʾakhkharta fasaʾabdaʾu bi-dūnika.", "id": "Kalau kamu terlambat, saya akan mulai tanpamu.", "t": 33}, {"n": "2061", "ar": "لَوْلَا الزِّحَامُ لَوَصَلْنَا مُبَكِّرًا.", "tr": "Lawlā az-ziḥāmu lawaṣalnā mubakkiran.", "id": "Seandainya tidak macet, kita pasti tiba lebih awal.", "t": 33}, {"n": "2062", "ar": "كَمْ أَتَمَنَّى أَنْ أَرَاكَ مَرَّةً أُخْرَى!", "tr": "Kam atamannā an arāka marratan ukhrā!", "id": "Betapa saya berharap bisa bertemu denganmu sekali lagi!", "t": 33}, {"n": "2063", "ar": "لَوْ كَانَ عِنْدِي وَقْتٌ أَكْثَرُ لَسَاعَدْتُكَ.", "tr": "Law kāna ʿindī waqtun aktharu lasāʿadtuka.", "id": "Seandainya saya punya lebih banyak waktu, saya akan membantumu.", "t": 33}, {"n": "2064", "ar": "لَيْتَ الْمَطَرَ يَتَوَقَّفُ قَبْلَ رَحِيلِنَا.", "tr": "Laytal-maṭara yatawaqqafu qabla raḥīlinā.", "id": "Semoga hujan berhenti sebelum kita berangkat.", "t": 33}, {"n": "2065", "ar": "مَاذَا تَفْعَلُ لَوْ رَبِحْتَ جَائِزَةً كَبِيرَةً؟", "tr": "Mādhā tafʿalu law rabiḥta jāʾizatan kabīratan?", "id": "Apa yang akan kamu lakukan seandainya memenangkan hadiah besar?", "t": 33}, {"n": "2066", "ar": "لَوْ تَرَكْتُ الْعَمَلَ لَفَقَدْتُ دَخْلِي.", "tr": "Law taraktu al-ʿamala lafaqadtu dakhlī.", "id": "Seandainya saya berhenti bekerja, saya akan kehilangan penghasilan.", "t": 33}, {"n": "2067", "ar": "أَشْعُرُ بِالنَّدَمِ لِأَنِّي لَمْ أَزُرْ جَدِّي كَثِيرًا.", "tr": "Ashʿuru bin-nadami li-annī lam azur jaddī kathīran.", "id": "Saya menyesal karena tidak sering mengunjungi kakek.", "t": 33}, {"n": "2068", "ar": "إِنْ نَجَحْتَ فِي الْمُقَابَلَةِ فَسَتَبْدَأُ الْعَمَلَ فِي الشَّهْرِ الْقَادِمِ.", "tr": "In najaḥta fī al-muqābalati fasatabdaʾu al-ʿamala fī ash-shahri al-qādimi.", "id": "Jika kamu berhasil dalam wawancara, kamu akan mulai bekerja bulan depan.", "t": 33}, {"n": "2069", "ar": "لَوْ أُتِيحَتْ لِيَ الْفُرْصَةُ لَدَرَسْتُ فِي الْخَارِجِ.", "tr": "Law utīḥat liya al-furṣatu ladarastu fī al-khāriji.", "id": "Seandainya ada kesempatan, saya akan belajar di luar negeri.", "t": 33}, {"n": "2070", "ar": "مَا كُنْتُ أَتَوَقَّعُ أَنَّ الْأَمْرَ صَعْبٌ هَكَذَا.", "tr": "Mā kuntu atawaqqaʿu anna al-amra ṣaʿbun hākadhā.", "id": "Saya tidak mengira ternyata sesulit ini.", "t": 33}, {"n": "2071", "ar": "الْوَقْتُ مِنْ ذَهَبٍ.", "tr": "Al-waqtu min dhahabin.", "id": "Waktu adalah emas.", "t": 34}, {"n": "2072", "ar": "الْعِلْمُ فِي الصِّغَرِ كَالنَّقْشِ عَلَى الْحَجَرِ.", "tr": "Al-ʿilmu fī aṣ-ṣighari kan-naqshi ʿalā al-ḥajari.", "id": "Belajar di waktu kecil bagaikan mengukir di atas batu.", "t": 34}, {"n": "2073", "ar": "الصَّبْرُ مِفْتَاحُ الْفَرَجِ.", "tr": "Aṣ-ṣabru miftāḥu al-farajī.", "id": "Kesabaran adalah kunci jalan keluar.", "t": 34}, {"n": "2074", "ar": "الْجَارُ قَبْلَ الدَّارِ.", "tr": "Al-jāru qabla ad-dāri.", "id": "Pilih tetangga dulu sebelum memilih rumah.", "t": 34}, {"n": "2075", "ar": "مَنْ جَدَّ وَجَدَ.", "tr": "Man jadda wajada.", "id": "Siapa bersungguh-sungguh, dia akan berhasil.", "t": 34}, {"n": "2076", "ar": "الْوِقَايَةُ خَيْرٌ مِنَ الْعِلَاجِ.", "tr": "Al-wiqāyatu khayrun mina al-ʿilāji.", "id": "Mencegah lebih baik daripada mengobati.", "t": 34}, {"n": "2077", "ar": "الطُّيُورُ عَلَى أَشْكَالِهَا تَقَعُ.", "tr": "Aṭ-ṭuyūru ʿalā ashkālihā taqaʿu.", "id": "Burung-burung berkumpul dengan sejenisnya.", "t": 34}, {"n": "2078", "ar": "لَيْسَ كُلُّ مَا يَلْمَعُ ذَهَبًا.", "tr": "Laysa kullu mā yalmaʿu dhahaban.", "id": "Tidak semua yang berkilau itu emas.", "t": 34}, {"n": "2079", "ar": "رُبَّ أَخٍ لَمْ تَلِدْهُ أُمُّكَ.", "tr": "Rubba akhin lam taliduhu ummuka.", "id": "Boleh jadi ada saudara yang tidak dilahirkan oleh ibumu.", "t": 34}, {"n": "2080", "ar": "الْعَجَلَةُ مِنَ الشَّيْطَانِ وَالتَّأَنِّي مِنَ الرَّحْمَنِ.", "tr": "Al-ʿajalatu mina ash-shayṭāni wat-taʾannī mina ar-raḥmāni.", "id": "Tergesa-gesa itu dari setan, sedangkan hati-hati dari Yang Maha Pengasih.", "t": 34}, {"n": "2081", "ar": "مَا كُلُّ مَا يَتَمَنَّى الْمَرْءُ يُدْرِكُهُ.", "tr": "Mā kullu mā yatamannā al-marʾu yudrikuhu.", "id": "Tidak semua yang diinginkan seseorang pasti tercapai.", "t": 34}, {"n": "2082", "ar": "يَدٌ وَاحِدَةٌ لَا تُصَفِّقُ.", "tr": "Yadun wāḥidatun lā tuṣaffiqu.", "id": "Satu tangan tidak bisa bertepuk.", "t": 34}, {"n": "2083", "ar": "خَيْرُ الْكَلَامِ مَا قَلَّ وَدَلَّ.", "tr": "Khayru al-kalāmi mā qalla wa dalla.", "id": "Sebaik-baik ucapan adalah yang singkat dan bermakna.", "t": 34}, {"n": "2084", "ar": "هُوَ يَضْرِبُ عُصْفُورَيْنِ بِحَجَرٍ وَاحِدٍ.", "tr": "Huwa yaḍribu ʿuṣfūrayni bi-ḥajarin wāḥidin.", "id": "Dia sekali mendayung dua tiga pulau terlampaui.", "t": 34}, {"n": "2085", "ar": "لَا تَضَعْ بَيْضَكَ كُلَّهُ فِي سَلَّةٍ وَاحِدَةٍ.", "tr": "Lā taḍaʿ bayḍaka kullahu fī sallatin wāḥidatin.", "id": "Jangan menaruh semua telurmu dalam satu keranjang.", "t": 34}, {"n": "2086", "ar": "بَعْدَ الْعُسْرِ يُسْرٌ.", "tr": "Baʿda al-ʿusri yusrun.", "id": "Setelah kesulitan ada kemudahan.", "t": 34}, {"n": "2087", "ar": "لَقَدْ كَسَرَ الْجَلِيدَ بَيْنَنَا بِنُكْتَةٍ لَطِيفَةٍ.", "tr": "Laqad kasara al-jalīda baynanā bi-nuktatin laṭīfatin.", "id": "Dia mencairkan suasana di antara kami dengan lelucon yang menyenangkan.", "t": 34}, {"n": "2088", "ar": "مَنْ سَارَ عَلَى الدَّرْبِ وَصَلَ.", "tr": "Man sāra ʿalā ad-darbi waṣala.", "id": "Siapa berjalan di jalannya, dia akan sampai.", "t": 34}, {"n": "2089", "ar": "فَقَدْتُ حَقِيبَتِي فِي الْمَطَارِ.", "tr": "Faqadtu ḥaqībatī fī al-maṭāri.", "id": "Saya kehilangan tas saya di bandara.", "t": 35}, {"n": "2090", "ar": "أُرِيدُ أَنْ أُبَلِّغَ عَنْ ضَيَاعِ جَوَازِ سَفَرِي.", "tr": "Urīdu an uballigha ʿan ḍayāʿi jawāzi safarī.", "id": "Saya ingin melaporkan paspor saya hilang.", "t": 35}, {"n": "2091", "ar": "أُلْغِيَتْ رِحْلَتِي بِسَبَبِ الْعَاصِفَةِ.", "tr": "Ulghiyat riḥlatī bi-sababi al-ʿāṣifati.", "id": "Penerbangan saya dibatalkan karena badai.", "t": 35}, {"n": "2092", "ar": "فَاتَتْنِي الطَّائِرَةُ بِسَبَبِ الزِّحَامِ.", "tr": "Fātatnī aṭ-ṭāʾiratu bi-sababi az-ziḥāmi.", "id": "Saya ketinggalan pesawat karena kemacetan.", "t": 35}, {"n": "2093", "ar": "هَلْ يُغَطِّي التَّأْمِينُ الْعِلَاجَ فِي الْخَارِجِ؟", "tr": "Hal yughaṭṭī at-taʾmīnu al-ʿilāja fī al-khāriji?", "id": "Apakah asuransi menanggung pengobatan di luar negeri?", "t": 35}, {"n": "2094", "ar": "تَعَطَّلَتْ سَيَّارَتِي عَلَى الطَّرِيقِ السَّرِيعِ.", "tr": "Taʿaṭṭalat sayyāratī ʿalā aṭ-ṭarīqi as-sarīʿi.", "id": "Mobil saya mogok di jalan tol.", "t": 35}, {"n": "2095", "ar": "اتَّصِلْ بِالشُّرْطَةِ إِذَا حَدَثَ شَيْءٌ.", "tr": "Ittaṣil bish-shurṭati idhā ḥadatha shayʾun.", "id": "Hubungi polisi jika terjadi sesuatu.", "t": 35}, {"n": "2096", "ar": "هُنَاكَ حَرِيقٌ فِي الطَّابِقِ الثَّانِي!", "tr": "Hunāka ḥarīqun fī aṭ-ṭābiqi ath-thānī!", "id": "Ada kebakaran di lantai dua!", "t": 35}, {"n": "2097", "ar": "أَحْتَاجُ إِلَى سَيَّارَةِ إِسْعَافٍ حَالًا.", "tr": "Aḥtāju ilā sayyārati isʿāfin ḥālan.", "id": "Saya butuh ambulans sekarang juga.", "t": 35}, {"n": "2098", "ar": "ضَاعَتْ مِنِّي مَحْفَظَتِي وَفِيهَا بِطَاقَاتِي.", "tr": "Ḍāʿat minnī maḥfaẓatī wa fīhā biṭāqātī.", "id": "Dompet saya hilang dan kartu-kartu saya ada di dalamnya.", "t": 35}, {"n": "2099", "ar": "أَيْنَ أَقْرَبُ سِفَارَةٍ لِبَلَدِي؟", "tr": "Ayna aqrabu sifāratin li-baladī?", "id": "Di mana kedutaan terdekat untuk negara saya?", "t": 35}, {"n": "2100", "ar": "تَأَخَّرَ الْقِطَارُ سَاعَتَيْنِ بِسَبَبِ عُطْلٍ فَنِّيٍّ.", "tr": "Taʾakhkhara al-qiṭāru sāʿatayni bi-sababi ʿuṭlin fanniyyin.", "id": "Kereta terlambat dua jam karena gangguan teknis.", "t": 35}, {"n": "2101", "ar": "لَمْ أَحْجِزْ فُنْدُقًا وَالْمَدِينَةُ مُزْدَحِمَةٌ.", "tr": "Lam aḥjiz funduqan wal-madīnatu muzdaḥimatun.", "id": "Saya belum memesan hotel dan kota ini ramai sekali.", "t": 35}, {"n": "2102", "ar": "أَنَا ضَائِعٌ، هَلْ تَدُلُّنِي عَلَى الطَّرِيقِ؟", "tr": "Anā ḍāʾiʿun, hal tadullunī ʿalā aṭ-ṭarīqi?", "id": "Saya tersesat, bisaka "Nisbatu al-fāʾidati ʿalā hādhā al-qarḍi murtafiʿatun.", "id": "Suku bunga pinjaman ini tinggi.", "t": 40}, {"n": "2183", "ar": "أَنْفَقْتُ أَكْثَرَ مِمَّا خَطَّطْتُ هَذَا الشَّهْرَ.", "tr": "Anfaqtu akthara mimmā khaṭṭaṭtu hādhā ash-shahra.", "id": "Bulan ini saya mengeluarkan lebih banyak daripada yang saya rencanakan.", "t": 40}, {"n": "2184", "ar": "لَا أَشْتَرِي إِلَّا مَا أَحْتَاجُ إِلَيْهِ فِعْلًا.", "tr": "Lā ashtarī illā mā aḥtāju ilayhi fiʿlan.", "id": "Saya hanya membeli apa yang benar-benar saya butuhkan.", "t": 40}, {"n": "2185", "ar": "بِكَمْ تَبِيعُونَ الدُّولَارَ الْيَوْمَ؟", "tr": "Bikam tabīʿūna ad-dūlāra al-yawma?", "id": "Berapa Anda menjual dolar hari ini?", "t": 40}, {"n": "2186", "ar": "هَلْ تَقْبَلُونَ الدَّفْعَ بِالْبِطَاقَةِ؟", "tr": "Hal taqbalūna ad-dafʿa bil-biṭāqati?", "id": "Apakah Anda menerima pembayaran dengan kartu?", "t": 40}, {"n": "2187", "ar": "وَصَلَتْنِي فَاتُورَةٌ أَعْلَى مِنَ الْمُعْتَادِ.", "tr": "Waṣalatnī fātūratun aʿlā mina al-muʿtādi.", "id": "Tagihan yang sampai kepada saya lebih tinggi dari biasanya.", "t": 40}, {"n": "2188", "ar": "أَدْفَعُ الْقِسْطَ الشَّهْرِيَّ فِي أَوَّلِ كُلِّ شَهْرٍ.", "tr": "Adfaʿu al-qisṭa ash-shahriyya fī awwali kulli shahrin.", "id": "Saya membayar cicilan bulanan di awal setiap bulan.", "t": 40}, {"n": "2189", "ar": "مِنَ الْحِكْمَةِ أَنْ نُخَصِّصَ مَبْلَغًا لِلطَّوَارِئِ.", "tr": "Mina al-ḥikmati an nukhaṣṣiṣa mablaghan liṭ-ṭawāriʾi.", "id": "Adalah bijak jika kita menyisihkan dana untuk keadaan darurat.", "t": 40}, {"n": "2190", "ar": "ارْتَفَعَتِ الْأَسْعَارُ فِي الْأَشْهُرِ الْمَاضِيَةِ.", "tr": "Irtafaʿati al-asʿāru fī al-ashhuri al-māḍiyati.", "id": "Harga-harga naik dalam beberapa bulan terakhir.", "t": 40}, {"n": "2191", "ar": "أَرْغَبُ فِي شِرَاءِ سَيَّارَةٍ مُسْتَعْمَلَةٍ.", "tr": "Arghabu fī shirāʾi sayyāratin mustaʿmalatin.", "id": "Saya ingin membeli mobil bekas.", "t": 40}, {"n": "2192", "ar": "هَلْ تُرِيدُ إِيصَالًا بِالْمَبْلَغِ؟", "tr": "Hal turīdu īṣālan bil-mablaghi?", "id": "Apakah Anda ingin kuitansi pembayaran?", "t": 40}, {"n": "2193", "ar": "خُصِمَ مِنْ حِسَابِي مَبْلَغٌ لَا أَعْرِفُهُ.", "tr": "Khuṣima min ḥisābī mablaghun lā aʿrifuhu.", "id": "Ada sejumlah uang terpotong dari rekening saya yang tidak saya ketahui.", "t": 40}, {"n": "2194", "ar": "أُفَضِّلُ الِادِّخَارَ عَلَى شِرَاءِ أَشْيَاءَ غَيْرِ ضَرُورِيَّةٍ.", "tr": "Ufaḍḍilu al-iddikhāra ʿalā shirāʾi ashyāʾa ghayri ḍarūriyyatin.", "id": "Saya lebih suka menabung daripada membeli barang yang tidak perlu.", "t": 40}, {"n": "2195", "ar": "هَلْ تُفَضِّلُ الدَّفْعَ دُفْعَةً وَاحِدَةً أَمْ بِالتَّقْسِيطِ؟", "tr": "Hal tufaḍḍilu ad-dafʿa dufʿatan wāḥidatan am bit-taqsīṭi?", "id": "Apakah kamu lebih suka membayar sekaligus atau dicicil?", "t": 40}, {"n": "2196", "ar": "لَا تُقْرِضْ مَالَكَ لِأَحَدٍ إِلَّا إِذَا كُنْتَ قَادِرًا عَلَى خَسَارَتِهِ.", "tr": "Lā tuqriḍ mālaka li-aḥadin illā idhā kunta qādiran ʿalā khasāratihi.", "id": "Jangan meminjamkan uangmu kepada siapa pun kecuali kamu siap kehilangannya.", "t": 40}, {"n": "2197", "ar": "كُلُّ عَامٍ وَأَنْتُمْ بِخَيْرٍ، عِيدٌ مُبَارَكٌ!", "tr": "Kulla ʿāmin wa antum bi-khayrin, ʿīdun mubārakun!", "id": "Selamat Hari Raya, semoga kalian selalu sehat dan bahagia!", "t": 41}, {"n": "2198", "ar": "نَجْتَمِعُ كُلَّ عِيدٍ فِي بَيْتِ جَدِّي.", "tr": "Najtamiʿu kulla ʿīdin fī bayti jaddī.", "id": "Setiap hari raya kami berkumpul di rumah kakek.", "t": 41}, {"n": "2199", "ar": "يَلْبَسُ الْأَطْفَالُ ثِيَابًا جَدِيدَةً فِي الْعِيدِ.", "tr": "Yalbasu al-aṭfālu thiyāban jadīdatan fī al-ʿīdi.", "id": "Anak-anak memakai baju baru saat hari raya.", "t": 41}, {"n": "2200", "ar": "نُحَضِّرُ الْحَلْوَى وَالْكَعْكَ قَبْلَ الْعِيدِ بِأَيَّامٍ.", "tr": "Nuḥaḍḍiru al-ḥalwā wal-kaʿka qabla al-ʿīdi bi-ayyāmin.", "id": "Kami menyiapkan manisan dan kue beberapa hari sebelum hari raya.", "t": 41}, {"n": "2201", "ar": "فِي رَمَضَانَ نُفْطِرُ مَعًا عِنْدَ الْغُرُوبِ.", "tr": "Fī Ramaḍāna nufṭiru maʿan ʿinda al-ghurūbi.", "id": "Di bulan Ramadan kami berbu
